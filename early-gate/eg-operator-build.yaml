  finally:
    # Tag + cleanup and the leader-PR report are one task, not two, because Tekton
    # runs finally tasks in parallel with no ordering control and forbids one finally
    # task from consuming another's results.  Split in two, the reporter would race
    # the cleanup for the ephemeral branch HEAD - and lose it outright once the
    # branch is deleted, leaving it unable to name the tag it is meant to link.  As
    # steps they are ordered, and the tag name passes between them as a result.
    - name: tag-cleanup-and-report
      params:
        - name: repo
          value: $(params.operator-repo)
        - name: branch-name
          value: eg-$(params.leader-pr-number)
        - name: leader-pr-repo
          value: $(params.leader-pr-repo)
        - name: leader-pr-number
          value: $(params.leader-pr-number)
        - name: image-url
          value: $(params.output-image)
        - name: build-status
          value: $(tasks.build-image-index.status)
        - name: pipeline-status
          value: $(tasks.status)
        - name: pipelinerun-name
          value: $(context.pipelineRun.name)
      taskSpec:
        description: |
          Preserves the ephemeral branch HEAD as a tag, deletes the branch, then
          posts the outcome to the leader PR.

          Params are deliberately read from `params` and `.status` only.  A finally
          task that consumes a *result* of a task that failed or was skipped is
          itself skipped, so referencing build-image-index results here would make
          this task disappear in exactly the failure cases it exists to report.
          `$(tasks.<name>.status)` carries no such penalty - it resolves to None for
          a skipped task - and output-image is known up front.  That is also why the
          published image ref is recomputed here from the commit being tagged rather
          than read from get-latest-commit.results.image-ref.
        params:
          - name: repo
            type: string
          - name: branch-name
            type: string
          - name: leader-pr-repo
            type: string
          - name: leader-pr-number
            type: string
          - name: image-url
            type: string
          - name: build-status
            type: string
          - name: pipeline-status
            type: string
          - name: pipelinerun-name
            type: string
        results:
          - name: tag-name
            description: Tag created from the ephemeral branch HEAD, empty if none was created
          - name: tagged-commit
            description: Commit the tag points at, empty if the branch was already gone
        workspaces:
          - name: github-credentials
            optional: true
            description: Secret workspace holding a 'token' key with a GitHub API token
        steps:
          - name: tag-and-cleanup
            image: registry.access.redhat.com/ubi9/ubi-minimal:latest
            script: |
              #!/bin/bash
              # No `set -e`: this step must never abort the task, or the report step
              # below it never runs.  Both results are always written, empty if the
              # branch had already gone.
              set -uo pipefail

              TOKEN=$(cat "$(workspaces.github-credentials.path)/token")
              REPO="$(params.repo)"
              BRANCH="$(params.branch-name)"

              : > $(results.tag-name.path)
              : > $(results.tagged-commit.path)

              HEAD_SHA=$(curl -sS -H "Authorization: token ${TOKEN}" \
                "https://api.github.com/repos/${REPO}/git/ref/heads/${BRANCH}" \
                | grep -o '"sha"[[:space:]]*:[[:space:]]*"[^"]*"' | head -1 | cut -d'"' -f4)

              if [ -z "${HEAD_SHA}" ]; then
                echo "Branch ${BRANCH} not found - never created, or already cleaned up"
                exit 0
              fi

              SHORT_SHA="${HEAD_SHA:0:7}"
              TAG_NAME="eg-build-$(params.leader-pr-number)-${SHORT_SHA}"

              echo "Creating tag ${TAG_NAME} at ${HEAD_SHA}"
              HTTP_CODE=$(curl -sS -o /dev/null -w "%{http_code}" \
                -H "Authorization: token ${TOKEN}" \
                -X POST "https://api.github.com/repos/${REPO}/git/refs" \
                -d "{\"ref\":\"refs/tags/${TAG_NAME}\",\"sha\":\"${HEAD_SHA}\"}")

              if [ "${HTTP_CODE}" = "201" ]; then
                echo "Tag created: ${TAG_NAME}"
              elif [ "${HTTP_CODE}" = "422" ]; then
                echo "Tag ${TAG_NAME} already exists - same commit, nothing to do"
              else
                echo "Tag creation returned HTTP ${HTTP_CODE}" >&2
                # The branch is deliberately left in place: without a tag it is the
                # only remaining handle on the commit.
                exit 0
              fi

              echo -n "${TAG_NAME}" > $(results.tag-name.path)
              echo -n "${HEAD_SHA}" > $(results.tagged-commit.path)

              echo "Deleting branch ${BRANCH}"
              DEL_CODE=$(curl -sS -o /dev/null -w "%{http_code}" \
                -H "Authorization: token ${TOKEN}" \
                -X DELETE "https://api.github.com/repos/${REPO}/git/refs/heads/${BRANCH}")

              if [ "${DEL_CODE}" = "204" ]; then
                echo "Branch ${BRANCH} deleted"
              else
                echo "Branch deletion returned HTTP ${DEL_CODE} - may already be gone" >&2
              fi

              echo "Cleanup complete. Tag: ${TAG_NAME}, Commit: ${HEAD_SHA}"
          - name: post-status
            image: registry.access.redhat.com/ubi9/ubi-minimal:latest
            script: |
              #!/bin/bash
              set -euo pipefail

              # jq builds the request body.  Hand-rolled "{\"body\":\"...\"}" breaks on
              # any quote or newline in the message, and is also what makes the
              # comment lookup below correct rather than "first id in the payload".
              microdnf install -y jq >/dev/null

              TOKEN=$(cat "$(workspaces.github-credentials.path)/token")
              REPO="$(params.leader-pr-repo)"
              PR_NUM="$(params.leader-pr-number)"
              OP_REPO="$(params.repo)"
              TAG_NAME=$(cat $(results.tag-name.path))
              TAGGED_COMMIT=$(cat $(results.tagged-commit.path))

              MARKER="<!-- eg-operator-build-status -->"

              # build-status is `None` in two very different situations: the
              # single-PR skip, where every build task is guarded off and the
              # pipeline is green, and a cascade skip, where an upstream task
              # failed and took build-image-index down with it.  Only the first
              # is a skip; tell them apart on the pipeline status.
              if [ "$(params.build-status)" = "Succeeded" ]; then
                HEADLINE=":white_check_mark: EG Operator Build - Passed"
              elif [ "$(params.pipeline-status)" = "Failed" ]; then
                HEADLINE=":x: EG Operator Build - Failed"
              elif [ "$(params.build-status)" = "None" ]; then
                HEADLINE=":fast_forward: EG Operator Build - Skipped"
              else
                HEADLINE=":x: EG Operator Build - Failed"
              fi

              BODY="${MARKER}
              ## ${HEADLINE}

              **Repo:** ${OP_REPO}
              **Build:** $(params.build-status) | **Pipeline:** $(params.pipeline-status)
              **PipelineRun:** $(params.pipelinerun-name)"

              # Where the bits came from.  The branch is deleted a few lines up, so
              # link the commit - that reference outlives the run - and give the
              # branch by name only.
              if [ -n "${TAGGED_COMMIT}" ]; then
                BODY="${BODY}
              **Built from:** \`$(params.branch-name)\` @ [\`${TAGGED_COMMIT:0:7}\`](https://github.com/${OP_REPO}/commit/${TAGGED_COMMIT})"
              fi

              # Only advertise the image when one was actually built and pushed.
              # After a failed or skipped build the ref points at nothing, and
              # printing it invites someone to pull a tag that does not exist.
              #
              # The ref is recomputed rather than taken from get-latest-commit:
              # image-url carries the caller's output-image, whose tag is the PaC
              # {{revision}} and names the wrong commit, but reading the result
              # would tie this finally task to a task that does not run on every
              # failure path and so would skip the report entirely.  Derive it from
              # the commit that was just tagged, which is the same commit the build
              # used.
              if [ "$(params.build-status)" = "Succeeded" ]; then
                IMAGE_URL="$(params.image-url)"
                if [ -n "${TAGGED_COMMIT}" ]; then
                  LAST="${IMAGE_URL##*:}"
                  if [ "${LAST}" != "${IMAGE_URL}" ] && [ "${LAST}" = "${LAST#*/}" ]; then
                    IMAGE_URL="${IMAGE_URL%:*}"
                  fi
                  IMAGE_URL="${IMAGE_URL}:eg-${TAGGED_COMMIT}"
                fi
                BODY="${BODY}
              **Image:** ${IMAGE_URL}"
              fi

              if [ -n "${TAG_NAME}" ]; then
                BODY="${BODY}
              **Tag:** [${TAG_NAME}](https://github.com/${OP_REPO}/tree/${TAG_NAME}) (\`${TAGGED_COMMIT}\`)"
              else
                BODY="${BODY}
              **Tag:** none - no ephemeral branch to preserve"
              fi

              # Find a previous status comment by marker.  Paginate: the marker may
              # well be on an older page of a busy leader PR, and missing it would
              # post a duplicate instead of updating.
              EXISTING=""
              for page in $(seq 1 10); do
                HTTP_CODE=$(curl -sS -o /tmp/comments.json -w "%{http_code}" \
                  -H "Authorization: token ${TOKEN}" \
                  "https://api.github.com/repos/${REPO}/issues/${PR_NUM}/comments?per_page=100&page=${page}")

                # Degrade rather than fail.  A finally task that exits non-zero fails
                # the whole PipelineRun, so an unreachable leader PR must not turn a
                # green build red - and leader-pr-number is a placeholder today.
                if [ "${HTTP_CODE}" != "200" ]; then
                  echo "Cannot read comments on ${REPO}#${PR_NUM} (HTTP ${HTTP_CODE}) - skipping status report" >&2
                  echo "${BODY}"
                  exit 0
                fi

                COUNT=$(jq 'length' /tmp/comments.json)
                FOUND=$(jq -r --arg m "${MARKER}" \
                  '[.[] | select((.body // "") | contains($m))] | last | .id // empty' /tmp/comments.json)
                [ -n "${FOUND}" ] && EXISTING="${FOUND}"
                [ "${COUNT}" -lt 100 ] && break
              done

              jq -n --arg body "${BODY}" '{body: $body}' > /tmp/payload.json

              if [ -n "${EXISTING}" ]; then
                HTTP_CODE=$(curl -sS -o /dev/null -w "%{http_code}" \
                  -H "Authorization: token ${TOKEN}" \
                  -X PATCH "https://api.github.com/repos/${REPO}/issues/comments/${EXISTING}" \
                  --data-binary @/tmp/payload.json)
                echo "Updated existing comment ${EXISTING} (HTTP ${HTTP_CODE})"
              else
                HTTP_CODE=$(curl -sS -o /dev/null -w "%{http_code}" \
                  -H "Authorization: token ${TOKEN}" \
                  -X POST "https://api.github.com/repos/${REPO}/issues/${PR_NUM}/comments" \
                  --data-binary @/tmp/payload.json)
                echo "Created new status comment (HTTP ${HTTP_CODE})"
              fi

              # The read succeeded, so a failed write is a real problem - most likely
              # the token lacks pull-requests:write on the leader PR repo.  Surface it
              # rather than reporting a status that was never posted.
              case "${HTTP_CODE}" in
                200|201) ;;
                *) echo "Status comment was not accepted (HTTP ${HTTP_CODE})" >&2; exit 1 ;;
              esac
      workspaces:
        - name: github-credentials
          workspace: github-credentials
      when:
        - input: $(params.enable-eg-orchestration)
          operator: in
          values:
            - "true"
  workspaces:
    - name: git-auth
      optional: true
    - name: netrc
      optional: true
    - name: github-credentials
      description: Secret workspace with a "token" key holding a GitHub API token (see the github-token-secret param).
      optional: true
