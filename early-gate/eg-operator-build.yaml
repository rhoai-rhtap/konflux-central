apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: eg-operator-build
spec:
  description: |
    This pipeline is ideal for building container images from a Containerfile while maintaining trust after pipeline customization.

    _Uses `buildah` to create a container image leveraging [trusted artifacts](https://konflux-ci.dev/architecture/ADR/0036-trusted-artifacts.html). It also optionally creates a source image and runs some build-time tests. Information is shared between tasks using OCI artifacts instead of PVCs. EC will pass the [`trusted_task.trusted`](https://conforma.dev/docs/policy/packages/release_trusted_task.html#trusted_task__trusted) policy as long as all data used to build the artifact is generated from trusted tasks.
    This pipeline is pushed as a Tekton bundle to [quay.io](https://quay.io/repository/konflux-ci/tekton-catalog/pipeline-docker-build-oci-ta?tab=tags)_
  params:
    - description: Source Repository URL
      name: git-url
      type: string
    - description: Revision of the Source Repository
      name: revision
      type: string
    - description: Fully Qualified Output Image
      name: output-image
      type: string
    - default: .
      description: Path to the source code of an application's component from where to build image.
      name: path-context
      type: string
    - default: Dockerfiles/Dockerfile.konflux
      description: Path to the Dockerfile inside the context specified by parameter path-context
      name: dockerfile
      type: string
    - default: "false"
      description: Skip checks against built image
      name: skip-checks
      type: string
    - default: "true"
      description: Execute the build with network isolation
      name: hermetic
      type: string
    - default: "[{\"type\":\"gomod\",\"path\":\".\"},{\"type\":\"rpm\",\"path\":\".\"}]"
      description: Build dependencies to be prefetched
      name: prefetch-input
      type: string
    - default: ""
      description: Image tag expiration time, time values could be something like 1h, 2d, 3w for hours, days, and weeks, respectively.
      name: image-expires-after
      type: string
    - default: "false"
      description: Build a source image.
      name: build-source-image
      type: string
    - default: "false"
      description: Add built image into an OCI image index
      name: build-image-index
      type: string
    - default: docker
      description: The format for the resulting image's mediaType. Valid values are oci or docker.
      name: buildah-format
      type: string
    - default: "false"
      description: Enable cache proxy configuration
      name: enable-cache-proxy
    - default: "true"
      description: Use the package registry proxy when prefetching dependencies
      name: enable-package-registry-proxy
    - default: .
      description: Target directories in component's source code to scan with SAST tools. Multiple values should be separated with commas.
      name: sast-target-dirs
      type: string
    - default: []
      description: Array of --build-arg values ("arg=value" strings) for buildah
      name: build-args
      type: array
    - default: ""
      description: Path to a file with build arguments for buildah, see https://www.mankier.com/1/buildah-build#--build-arg-file
      name: build-args-file
      type: string
    - default: "false"
      description: Whether to enable privileged mode, should be used only with remote VMs
      name: privileged-nested
      type: string
    - default: ""
      description: Sets the image created time and the SOURCE_DATE_EPOCH build argument. On its own, it does not change file timestamps inside the layers (set rewrite-timestamp to "true" for that). Leave empty to keep the actual build time.
      name: source-date-epoch
      type: string
    - default: "false"
      description: When "true", clamp file modification times in the image layers to at most source-date-epoch. Does nothing unless source-date-epoch is set.
      name: rewrite-timestamp
      type: string
    - default: "false"
      description: When "true", omit the build history (history timestamps, layer metadata, etc.) from the resulting image.
      name: omit-history
      type: string
    - name: leader-pr-number
      type: string
      description: Leader PR number in gated-artifacts-promoter
    - name: operator-repo
      type: string
      default: rhoai-rhtap/rhods-operator-gap
      description: Operator repo to fork ephemeral branch from
    - name: source-branch
      type: string
      default: stable
      description: Branch to fork from (stable or main)
    - name: github-token-secret
      type: string
      default: github-token
      description: Secret name containing GitHub token for API calls
  results:
    - description: ""
      name: IMAGE_URL
      value: $(tasks.build-image-index.results.IMAGE_URL)
    - description: ""
      name: IMAGE_DIGEST
      value: $(tasks.build-image-index.results.IMAGE_DIGEST)
    - description: ""
      name: CHAINS-GIT_URL
      value: $(tasks.clone-repository.results.url)
    - description: ""
      name: CHAINS-GIT_COMMIT
      value: $(tasks.clone-repository.results.commit)
  tasks:
    - name: create-ephemeral-branch
      params:
        - name: repo
          value: $(params.operator-repo)
        - name: source-branch
          value: $(params.source-branch)
        - name: branch-name
          value: eg-$(params.leader-pr-number)
      taskSpec:
        params:
          - name: repo
            type: string
          - name: source-branch
            type: string
          - name: branch-name
            type: string
        results:
          - name: branch-name
            description: Name of the created ephemeral branch
          - name: branch-sha
            description: SHA of the branch head
        workspaces:
          - name: github-credentials
            description: Secret workspace holding a 'token' key with a GitHub API token
        steps:
          - name: create-branch
            image: registry.access.redhat.com/ubi9/ubi-minimal:latest
            script: |
              #!/bin/bash
              set -euo pipefail

              REPO="$(params.repo)"
              SOURCE="$(params.source-branch)"
              BRANCH="$(params.branch-name)"
              TOKEN=$(cat "$(workspaces.github-credentials.path)/token")

              # Get source branch SHA.  The ref response carries a single "sha" key,
              # inside .object.  Tolerate both compact and pretty-printed JSON.
              SOURCE_SHA=$(curl -sS -H "Authorization: token ${TOKEN}" \
                "https://api.github.com/repos/${REPO}/git/ref/heads/${SOURCE}" \
                | grep -o '"sha"[[:space:]]*:[[:space:]]*"[^"]*"' | head -1 | cut -d'"' -f4 || true)

              if [ -z "${SOURCE_SHA}" ]; then
                echo "Could not resolve head of ${SOURCE} in ${REPO}. Check the branch exists and the token has read access." >&2
                exit 1
              fi
              echo "Source ${SOURCE} is at ${SOURCE_SHA}"

              # Try to create the branch; if it already exists, force it to match.
              HTTP_CODE=$(curl -sS -o /dev/null -w "%{http_code}" \
                -H "Authorization: token ${TOKEN}" \
                -X POST "https://api.github.com/repos/${REPO}/git/refs" \
                -d "{\"ref\":\"refs/heads/${BRANCH}\",\"sha\":\"${SOURCE_SHA}\"}")

              if [ "${HTTP_CODE}" = "422" ]; then
                echo "Branch ${BRANCH} already exists - resetting it to ${SOURCE_SHA}"
                PATCH_CODE=$(curl -sS -o /dev/null -w "%{http_code}" \
                  -H "Authorization: token ${TOKEN}" \
                  -X PATCH "https://api.github.com/repos/${REPO}/git/refs/heads/${BRANCH}" \
                  -d "{\"sha\":\"${SOURCE_SHA}\",\"force\":true}")
                if [ "${PATCH_CODE}" != "200" ]; then
                  echo "Failed to reset ${BRANCH} (HTTP ${PATCH_CODE})" >&2
                  exit 1
                fi
              elif [ "${HTTP_CODE}" != "201" ]; then
                echo "Failed to create ${BRANCH} (HTTP ${HTTP_CODE})" >&2
                exit 1
              fi

              echo -n "${BRANCH}" > $(results.branch-name.path)
              echo -n "${SOURCE_SHA}" > $(results.branch-sha.path)
      workspaces:
        - name: github-credentials
          workspace: github-credentials
    - name: trigger-operator-processor
      params:
        - name: repo
          value: $(params.operator-repo)
        - name: branch-name
          value: eg-$(params.leader-pr-number)
        - name: leader-pr-number
          value: $(params.leader-pr-number)
      runAfter:
        - create-ephemeral-branch
      taskSpec:
        params:
          - name: repo
            type: string
          - name: branch-name
            type: string
          - name: leader-pr-number
            type: string
        results:
          - name: status
            description: success or failure
        workspaces:
          - name: github-credentials
            description: Secret workspace holding a 'token' key with a GitHub API token
        steps:
          - name: dispatch-and-wait
            image: registry.access.redhat.com/ubi9/ubi-minimal:latest
            script: |
              #!/bin/bash
              set -euo pipefail

              REPO="$(params.repo)"
              BRANCH="$(params.branch-name)"
              TOKEN=$(cat "$(workspaces.github-credentials.path)/token")

              RUNS_URL="https://api.github.com/repos/${REPO}/actions/runs?branch=${BRANCH}&event=workflow_dispatch&per_page=1"

              latest_run_id() {
                curl -sS -H "Authorization: token ${TOKEN}" "${RUNS_URL}" \
                  | grep -o '"id"[[:space:]]*:[[:space:]]*[0-9]*' | head -1 | tr -cd '0-9' || true
              }

              # Record the newest pre-existing run so a previous run on this branch is
              # never mistaken for ours - otherwise a stale success would pass the gate
              # instantly without operator-processor having run at all.
              PREV_ID=$(latest_run_id)
              echo "Newest pre-existing workflow_dispatch run on ${BRANCH}: ${PREV_ID:-none}"

              DISPATCH_CODE=$(curl -sS -o /dev/null -w "%{http_code}" \
                -H "Authorization: token ${TOKEN}" \
                -X POST "https://api.github.com/repos/${REPO}/actions/workflows/operator-processor.yaml/dispatches" \
                -d "{\"ref\":\"${BRANCH}\",\"inputs\":{\"eg-mode\":\"true\",\"eg-branch\":\"${BRANCH}\",\"leader-pr-number\":\"$(params.leader-pr-number)\"}}")

              if [ "${DISPATCH_CODE}" != "204" ]; then
                echo "workflow_dispatch was not accepted (HTTP ${DISPATCH_CODE})" >&2
                echo -n "failure" > $(results.status.path)
                exit 1
              fi
              echo "Dispatched operator-processor on ${BRANCH}"

              # Wait for the new run to be registered.
              sleep 10

              # Poll for completion (max 20 min).
              for i in $(seq 1 40); do
                RESP=$(curl -sS -H "Authorization: token ${TOKEN}" "${RUNS_URL}")
                RUN_ID=$(echo "${RESP}" | grep -o '"id"[[:space:]]*:[[:space:]]*[0-9]*' | head -1 | tr -cd '0-9' || true)

                if [ -n "${RUN_ID}" ] && [ "${RUN_ID}" != "${PREV_ID}" ]; then
                  # "conclusion" is null while in progress, so this stays empty until done.
                  STATUS=$(echo "${RESP}" | grep -o '"conclusion"[[:space:]]*:[[:space:]]*"[^"]*"' | head -1 | cut -d'"' -f4 || true)

                  if [ "${STATUS}" = "success" ]; then
                    echo -n "success" > $(results.status.path)
                    exit 0
                  elif [ -n "${STATUS}" ]; then
                    echo "operator-processor run ${RUN_ID} concluded: ${STATUS}" >&2
                    echo -n "failure" > $(results.status.path)
                    exit 1
                  fi
                fi

                echo "Waiting for operator-processor... attempt $i/40"
                sleep 30
              done

              echo "Timed out after 20 minutes waiting for operator-processor" >&2
              echo -n "timeout" > $(results.status.path)
              exit 1
      workspaces:
        - name: github-credentials
          workspace: github-credentials
    - name: get-latest-commit
      params:
        - name: repo
          value: $(params.operator-repo)
        - name: branch-name
          value: eg-$(params.leader-pr-number)
      runAfter:
        - trigger-operator-processor
      taskSpec:
        params:
          - name: repo
            type: string
          - name: branch-name
            type: string
        results:
          - name: commit-sha
            description: Latest commit SHA on ephemeral branch
        workspaces:
          - name: github-credentials
            description: Secret workspace holding a 'token' key with a GitHub API token
        steps:
          - name: get-sha
            image: registry.access.redhat.com/ubi9/ubi-minimal:latest
            script: |
              #!/bin/bash
              set -euo pipefail

              TOKEN=$(cat "$(workspaces.github-credentials.path)/token")

              SHA=$(curl -sS -H "Authorization: token ${TOKEN}" \
                "https://api.github.com/repos/$(params.repo)/git/ref/heads/$(params.branch-name)" \
                | grep -o '"sha"[[:space:]]*:[[:space:]]*"[^"]*"' | head -1 | cut -d'"' -f4 || true)

              if [ -z "${SHA}" ]; then
                echo "Could not resolve head of $(params.branch-name) in $(params.repo)" >&2
                exit 1
              fi

              echo "Ephemeral branch head is ${SHA}"
              echo -n "${SHA}" > $(results.commit-sha.path)
      workspaces:
        - name: github-credentials
          workspace: github-credentials
    - name: init
      params:
        - name: enable-cache-proxy
          value: $(params.enable-cache-proxy)
      taskRef:
        params:
          - name: name
            value: init
          - name: bundle
            value: quay.io/konflux-ci/tekton-catalog/task-init:0.4.2@sha256:421003a5c077ecb820460e71637125ec9093d2101c749a32ede28e190283e9db
          - name: kind
            value: task
        resolver: bundles
      runAfter:
        - get-latest-commit
    - name: clone-repository
      params:
        - name: url
          value: https://github.com/$(params.operator-repo).git
        - name: revision
          value: $(tasks.get-latest-commit.results.commit-sha)
        - name: ociStorage
          value: $(params.output-image).git
        - name: ociArtifactExpiresAfter
          value: $(params.image-expires-after)
      runAfter:
        - init
      taskRef:
        params:
          - name: name
            value: git-clone-oci-ta
          - name: bundle
            value: quay.io/konflux-ci/tekton-catalog/task-git-clone-oci-ta:0.2.4@sha256:df3c42d78223f07b40a84dd29e5c8860d14777ffdf150ea08c738770f51216dc
          - name: kind
            value: task
        resolver: bundles
      workspaces:
        - name: basic-auth
          workspace: git-auth
    - name: prefetch-dependencies
      params:
        - name: input
          value: $(params.prefetch-input)
        - name: enable-package-registry-proxy
          value: $(params.enable-package-registry-proxy)
        - name: SOURCE_ARTIFACT
          value: $(tasks.clone-repository.results.SOURCE_ARTIFACT)
        - name: ociStorage
          value: $(params.output-image).prefetch
        - name: ociArtifactExpiresAfter
          value: $(params.image-expires-after)
      runAfter:
        - clone-repository
      taskRef:
        params:
          - name: name
            value: prefetch-dependencies-oci-ta
          - name: bundle
            value: quay.io/konflux-ci/tekton-catalog/task-prefetch-dependencies-oci-ta:0.10.1@sha256:c09c1c3ced67fb8740b2925a7de09c0810d4e8c8f148d41c21ffe37810d85c62
          - name: kind
            value: task
        resolver: bundles
      workspaces:
        - name: git-basic-auth
          workspace: git-auth
        - name: netrc
          workspace: netrc
    - name: build-container
      params:
        - name: IMAGE
          value: $(params.output-image)
        - name: DOCKERFILE
          value: $(params.dockerfile)
        - name: CONTEXT
          value: $(params.path-context)
        - name: HERMETIC
          value: $(params.hermetic)
        - name: PREFETCH_INPUT
          value: $(params.prefetch-input)
        - name: IMAGE_EXPIRES_AFTER
          value: $(params.image-expires-after)
        - name: COMMIT_SHA
          value: $(tasks.clone-repository.results.commit)
        - name: BUILD_ARGS
          value:
            - $(params.build-args[*])
        - name: BUILD_ARGS_FILE
          value: $(params.build-args-file)
        - name: PRIVILEGED_NESTED
          value: $(params.privileged-nested)
        - name: SOURCE_URL
          value: $(tasks.clone-repository.results.url)
        - name: BUILDAH_FORMAT
          value: $(params.buildah-format)
        - name: HTTP_PROXY
          value: $(tasks.init.results.http-proxy)
        - name: NO_PROXY
          value: $(tasks.init.results.no-proxy)
        - name: SOURCE_DATE_EPOCH
          value: $(params.source-date-epoch)
        - name: REWRITE_TIMESTAMP
          value: $(params.rewrite-timestamp)
        - name: OMIT_HISTORY
          value: $(params.omit-history)
        - name: SOURCE_ARTIFACT
          value: $(tasks.prefetch-dependencies.results.SOURCE_ARTIFACT)
        - name: CACHI2_ARTIFACT
          value: $(tasks.prefetch-dependencies.results.CACHI2_ARTIFACT)
      runAfter:
        - prefetch-dependencies
      taskRef:
        params:
          - name: name
            value: buildah-oci-ta
          - name: bundle
            value: quay.io/konflux-ci/tekton-catalog/task-buildah-oci-ta:0.10.5@sha256:5fcf620537b0dece56a9c9a8090ce7592a874da92cc2a5d398abdc2382eb8a3c
          - name: kind
            value: task
        resolver: bundles
    - name: build-image-index
      params:
        - name: IMAGE
          value: $(params.output-image)
        - name: ALWAYS_BUILD_INDEX
          value: $(params.build-image-index)
        - name: IMAGES
          value:
            - $(tasks.build-container.results.IMAGE_URL)@$(tasks.build-container.results.IMAGE_DIGEST)
        - name: BUILDAH_FORMAT
          value: $(params.buildah-format)
      runAfter:
        - build-container
      taskRef:
        params:
          - name: name
            value: build-image-index
          - name: bundle
            value: quay.io/konflux-ci/tekton-catalog/task-build-image-index:0.3.1@sha256:cc75f64deecccb1b59e96ac1182665a5342d79c9e22eebff63d26b0f00a4319c
          - name: kind
            value: task
        resolver: bundles
    - name: build-source-image
      params:
        - name: BINARY_IMAGE
          value: $(tasks.build-image-index.results.IMAGE_URL)
        - name: BINARY_IMAGE_DIGEST
          value: $(tasks.build-image-index.results.IMAGE_DIGEST)
        - name: SOURCE_ARTIFACT
          value: $(tasks.prefetch-dependencies.results.SOURCE_ARTIFACT)
        - name: CACHI2_ARTIFACT
          value: $(tasks.prefetch-dependencies.results.CACHI2_ARTIFACT)
      runAfter:
        - build-image-index
      taskRef:
        params:
          - name: name
            value: source-build-oci-ta
          - name: bundle
            value: quay.io/konflux-ci/tekton-catalog/task-source-build-oci-ta:0.3@sha256:7c5575ac8e292f27f57716c021ab0324460dc958e73946724c588c5228e5f372
          - name: kind
            value: task
        resolver: bundles
      when:
        - input: $(params.build-source-image)
          operator: in
          values:
            - "true"
    - name: deprecated-base-image-check
      params:
        - name: IMAGE_URL
          value: $(tasks.build-image-index.results.IMAGE_URL)
        - name: IMAGE_DIGEST
          value: $(tasks.build-image-index.results.IMAGE_DIGEST)
      runAfter:
        - build-image-index
      taskRef:
        params:
          - name: name
            value: deprecated-image-check
          - name: bundle
            value: quay.io/konflux-ci/tekton-catalog/task-deprecated-image-check:0.5@sha256:0ccc688a77e9b7b0b8973c132a1e840844137e77f887be4a0bec8893b0776872
          - name: kind
            value: task
        resolver: bundles
      when:
        - input: $(params.skip-checks)
          operator: in
          values:
            - "false"
    - name: clair-scan
      params:
        - name: image-digest
          value: $(tasks.build-image-index.results.IMAGE_DIGEST)
        - name: image-url
          value: $(tasks.build-image-index.results.IMAGE_URL)
      runAfter:
        - build-image-index
      taskRef:
        params:
          - name: name
            value: clair-scan
          - name: bundle
            value: quay.io/konflux-ci/tekton-catalog/task-clair-scan:0.3@sha256:f5b4415db9ac1fba3e11d993a617e0b275d1f0ed2fc669b12c400ed848c39174
          - name: kind
            value: task
        resolver: bundles
      when:
        - input: $(params.skip-checks)
          operator: in
          values:
            - "false"
    - name: ecosystem-cert-preflight-checks
      params:
        - name: image-url
          value: $(tasks.build-image-index.results.IMAGE_URL)
      runAfter:
        - build-image-index
      taskRef:
        params:
          - name: name
            value: ecosystem-cert-preflight-checks
          - name: bundle
            value: quay.io/konflux-ci/tekton-catalog/task-ecosystem-cert-preflight-checks:0.2@sha256:c07d2befa8abf48d4a223a5bdf5ea2335e756d4d0bbc422761087c263060aa94
          - name: kind
            value: task
        resolver: bundles
      when:
        - input: $(params.skip-checks)
          operator: in
          values:
            - "false"
    - name: sast-snyk-check
      params:
        - name: image-digest
          value: $(tasks.build-image-index.results.IMAGE_DIGEST)
        - name: image-url
          value: $(tasks.build-image-index.results.IMAGE_URL)
        - name: TARGET_DIRS
          value: $(params.sast-target-dirs)
        - name: SOURCE_ARTIFACT
          value: $(tasks.prefetch-dependencies.results.SOURCE_ARTIFACT)
        - name: CACHI2_ARTIFACT
          value: $(tasks.prefetch-dependencies.results.CACHI2_ARTIFACT)
      runAfter:
        - build-image-index
      taskRef:
        params:
          - name: name
            value: sast-snyk-check-oci-ta
          - name: bundle
            value: quay.io/konflux-ci/tekton-catalog/task-sast-snyk-check-oci-ta:0.5@sha256:eba24f5d9f4b18aa71e523b9b3dbcf22982aa4b018824260a090b19dfc9abf6f
          - name: kind
            value: task
        resolver: bundles
      when:
        - input: $(params.skip-checks)
          operator: in
          values:
            - "false"
    - name: clamav-scan
      params:
        - name: image-digest
          value: $(tasks.build-image-index.results.IMAGE_DIGEST)
        - name: image-url
          value: $(tasks.build-image-index.results.IMAGE_URL)
      runAfter:
        - build-image-index
      taskRef:
        params:
          - name: name
            value: clamav-scan
          - name: bundle
            value: quay.io/konflux-ci/tekton-catalog/task-clamav-scan:0.3@sha256:53a02326bfb930ca5ef6bfa7a33acca833d57752f34f3cb79255fe2e25e7d217
          - name: kind
            value: task
        resolver: bundles
      when:
        - input: $(params.skip-checks)
          operator: in
          values:
            - "false"
    - name: sast-shell-check
      params:
        - name: image-digest
          value: $(tasks.build-image-index.results.IMAGE_DIGEST)
        - name: image-url
          value: $(tasks.build-image-index.results.IMAGE_URL)
        - name: TARGET_DIRS
          value: $(params.sast-target-dirs)
        - name: SOURCE_ARTIFACT
          value: $(tasks.prefetch-dependencies.results.SOURCE_ARTIFACT)
        - name: CACHI2_ARTIFACT
          value: $(tasks.prefetch-dependencies.results.CACHI2_ARTIFACT)
      runAfter:
        - build-image-index
      taskRef:
        params:
          - name: name
            value: sast-shell-check-oci-ta
          - name: bundle
            value: quay.io/konflux-ci/tekton-catalog/task-sast-shell-check-oci-ta:0.1@sha256:61b27e6ad5daba761d41bb37efb790ed98380603fd4fe2f86d156def5bd72ecc
          - name: kind
            value: task
        resolver: bundles
      when:
        - input: $(params.skip-checks)
          operator: in
          values:
            - "false"
    - name: sast-unicode-check
      params:
        - name: image-digest
          value: $(tasks.build-image-index.results.IMAGE_DIGEST)
        - name: image-url
          value: $(tasks.build-image-index.results.IMAGE_URL)
        - name: TARGET_DIRS
          value: $(params.sast-target-dirs)
        - name: SOURCE_ARTIFACT
          value: $(tasks.prefetch-dependencies.results.SOURCE_ARTIFACT)
        - name: CACHI2_ARTIFACT
          value: $(tasks.prefetch-dependencies.results.CACHI2_ARTIFACT)
      runAfter:
        - build-image-index
      taskRef:
        params:
          - name: name
