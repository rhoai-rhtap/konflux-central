apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: eg-operator-build
spec:
  description: |
    This pipeline is ideal for building container images from a Containerfile while maintaining trust after pipeline customization.

    _Uses `buildah` to create a container image leveraging [trusted artifacts](https://konflux-ci.dev/architecture/ADR/0036-trusted-artifacts.html). It also optionally creates a source image and runs some build-time tests. Information is shared between tasks using OCI artifacts instead of PVCs. EC will pass the [`trusted_task.trusted`](https://conforma.dev/docs/policy/packages/release_trusted_task.html#trusted_task__trusted) policy as long as all data used to build the artifact is generated from trusted tasks.
    This pipeline is pushed as a Tekton bundle to [quay.io](https://quay.io/repository/konflux-ci/tekton-catalog/pipeline-docker-build-oci-ta?tab=tags)_
  params:
    - name: enable-eg-orchestration
      type: string
      default: "false"
      description: Set to true to enable ephemeral branch fork + operator-processor
    - description: Source Repository URL
      name: git-url
      type: string
    - description: Revision of the Source Repository
      name: revision
      type: string
    - description: Fully Qualified Output Image
      name: output-image
      type: string
    - default: .
      description: Path to the source code of an application's component from where to build image.
      name: path-context
      type: string
    - default: Dockerfiles/Dockerfile.konflux
      description: Path to the Dockerfile inside the context specified by parameter path-context
      name: dockerfile
      type: string
    - default: "false"
      description: Skip checks against built image
      name: skip-checks
      type: string
    - default: "true"
      description: Execute the build with network isolation
      name: hermetic
      type: string
    - default: "[{\"type\":\"gomod\",\"path\":\".\"},{\"type\":\"rpm\",\"path\":\".\"}]"
      description: Build dependencies to be prefetched
      name: prefetch-input
      type: string
    - default: ""
      description: Image tag expiration time, time values could be something like 1h, 2d, 3w for hours, days, and weeks, respectively.
      name: image-expires-after
      type: string
    - default: "false"
      description: Build a source image.
      name: build-source-image
      type: string
    - default: "false"
      description: Add built image into an OCI image index
      name: build-image-index
      type: string
    - default: docker
      description: The format for the resulting image's mediaType. Valid values are oci or docker.
      name: buildah-format
      type: string
    - default: "false"
      description: Enable cache proxy configuration
      name: enable-cache-proxy
    - default: "true"
      description: Use the package registry proxy when prefetching dependencies
      name: enable-package-registry-proxy
    - default: .
      description: Target directories in component's source code to scan with SAST tools. Multiple values should be separated with commas.
      name: sast-target-dirs
      type: string
    - default: []
      description: Array of --build-arg values ("arg=value" strings) for buildah
      name: build-args
      type: array
    - default: ""
      description: Path to a file with build arguments for buildah, see https://www.mankier.com/1/buildah-build#--build-arg-file
      name: build-args-file
      type: string
    - default: "false"
      description: Whether to enable privileged mode, should be used only with remote VMs
      name: privileged-nested
      type: string
    - default: ""
      description: Sets the image created time and the SOURCE_DATE_EPOCH build argument. On its own, it does not change file timestamps inside the layers (set rewrite-timestamp to "true" for that). Leave empty to keep the actual build time.
      name: source-date-epoch
      type: string
    - default: "false"
      description: When "true", clamp file modification times in the image layers to at most source-date-epoch. Does nothing unless source-date-epoch is set.
      name: rewrite-timestamp
      type: string
    - default: "false"
      description: When "true", omit the build history (history timestamps, layer metadata, etc.) from the resulting image.
      name: omit-history
      type: string
    - name: leader-pr-number
      type: string
      description: Leader PR number in gated-artifacts-promoter
    - name: operator-repo
      type: string
      default: rhoai-rhtap/rhods-operator-gap
      description: Operator repo to fork ephemeral branch from
    - name: source-branch
      type: string
      default: stable
      description: |
        Fallback branch to fork from.  In EG mode check-leader-pr normally decides
        this (main when the leader PR carries an operator PR, stable otherwise);
        this value is used when orchestration is off or the leader PR cannot be read.
    - name: github-token-secret
      type: string
      default: github-token
      description: Secret name containing GitHub token for API calls
    - name: leader-pr-repo
      type: string
      default: red-hat-data-services/gated-artifacts-promoter
      description: Repo where the leader PR lives
  results:
    - description: ""
      name: IMAGE_URL
      value: $(tasks.build-image-index.results.IMAGE_URL)
    - description: ""
      name: IMAGE_DIGEST
      value: $(tasks.build-image-index.results.IMAGE_DIGEST)
    - description: ""
      name: CHAINS-GIT_URL
      value: $(tasks.clone-repository.results.url)
    - description: ""
      name: CHAINS-GIT_COMMIT
      value: $(tasks.clone-repository.results.commit)
  tasks:
    - name: check-leader-pr
      params:
        - name: enable-eg-orchestration
          value: $(params.enable-eg-orchestration)
        - name: leader-pr-repo
          value: $(params.leader-pr-repo)
        - name: leader-pr-number
          value: $(params.leader-pr-number)
        - name: operator-repo-name
          value: $(params.operator-repo)
        - name: fallback-source-branch
          value: $(params.source-branch)
      taskSpec:
        description: |
          Reads the leader PR to decide what the EG build should do.
          
        params:
          - name: enable-eg-orchestration
            type: string
          - name: leader-pr-repo
            type: string
          - name: leader-pr-number
            type: string
          - name: operator-repo-name
            type: string
          - name: fallback-source-branch
            type: string
        results:
          - name: source-branch
            description: Branch to fork the ephemeral branch from - main or stable
          - name: skip-eg-build
            description: true when the leader PR carries only the operator PR, so the Task 1 PR build can be reused
          - name: operator-pr-included
            description: |
              true when the leader PR lists a child PR against the operator repo.
              This is what decides main vs stable, so it is emitted separately for
              downstream tasks to report the reason rather than just the outcome.
        workspaces:
          - name: github-credentials
            optional: true
            description: Secret workspace holding a 'token' key. Only read in EG mode.
        steps:
          - name: check-pr
            image: registry.access.redhat.com/ubi9/ubi-minimal:latest
            script: |
              #!/bin/bash
              set -euo pipefail

              # One place that prints the decision, so every exit path - including
              # the degraded ones - says out loud which branch was chosen and why.
              # Without this the only clue in the logs is a branch name, and "eg-5
              # forked from stable" does not tell you whether stable was chosen or
              # merely fallen back to.
              summarise() {
                echo "----------------------------------------------------------"
                echo " Leader PR         $(params.leader-pr-repo)#$(params.leader-pr-number)"
                echo " Operator PR       $1"
                echo " Fork source       $2"
                echo " EG build          $3"
                echo " Reason            $4"
                echo "----------------------------------------------------------"
              }

              # Direct mode: nothing to look up, honour what the caller asked for.
              if [ "$(params.enable-eg-orchestration)" != "true" ]; then
                summarise "not checked" "$(params.fallback-source-branch)" "will run" \
                  "EG orchestration is disabled - the caller's branch is used as-is"
                echo -n "$(params.fallback-source-branch)" > $(results.source-branch.path)
                echo -n "false" > $(results.skip-eg-build.path)
                echo -n "false" > $(results.operator-pr-included.path)
                exit 0
              fi

              # jq, rather than grep, because a PR body is free text: it contains
              # escaped quotes and \n, which shear a grep/cut pipeline off at the
              # first one and silently truncate the body we are about to search.
              microdnf install -y jq >/dev/null

              TOKEN=$(cat "$(workspaces.github-credentials.path)/token")
              REPO="$(params.leader-pr-repo)"
              PR_NUM="$(params.leader-pr-number)"
              OP_REPO="$(params.operator-repo-name)"

              HTTP_CODE=$(curl -sS -o /tmp/pr.json -w "%{http_code}" \
                -H "Authorization: token ${TOKEN}" \
                "https://api.github.com/repos/${REPO}/pulls/${PR_NUM}")

              # Degrade rather than fail.  A leader PR that cannot be read must not
              # take the build down with it - fall back to the caller's branch and
              # build, which is the current pre-check-leader-pr behaviour.
              if [ "${HTTP_CODE}" != "200" ]; then
                echo "Could not read leader PR ${REPO}#${PR_NUM} (HTTP ${HTTP_CODE})" >&2
                summarise "unknown" "$(params.fallback-source-branch)" "will run" \
                  "leader PR could not be read (HTTP ${HTTP_CODE}) - fell back to the caller's branch"
                echo -n "$(params.fallback-source-branch)" > $(results.source-branch.path)
                echo -n "false" > $(results.skip-eg-build.path)
                echo -n "false" > $(results.operator-pr-included.path)
                exit 0
              fi

              PR_BODY=$(jq -r '.body // ""' /tmp/pr.json)

              # Every repo the leader PR references, deduplicated.  grep -c would
              # count matching *lines*, and the body is frequently one line, so it
              # would report 1 no matter how many repos were listed.
              LISTED=$(printf '%s' "${PR_BODY}" \
                | grep -oiE 'rhoai-rhtap/[A-Za-z0-9._-]+' | tr 'A-Z' 'a-z' | sort -u || true)
              PR_COUNT=$(printf '%s' "${LISTED}" | grep -c . || true)
              echo "Leader PR references ${PR_COUNT} repo(s):"
              printf '%s\n' "${LISTED}"

              if printf '%s' "${LISTED}" | grep -qixF "${OP_REPO}"; then
                # The operator itself is changing, so the ephemeral branch has to
                # carry that change: fork from main, where the operator PR lands.
                if [ "${PR_COUNT}" -le 1 ]; then
                  summarise "included" "main" "skipped" \
                    "the operator is the only component in this leader PR, so the image its own PR build already produced is reusable"
                  echo -n "true" > $(results.skip-eg-build.path)
                else
                  summarise "included" "main" "will run" \
                    "the leader PR changes the operator plus $((PR_COUNT - 1)) other component(s), so the operator must be rebuilt against them"
                  echo -n "false" > $(results.skip-eg-build.path)
                fi
                echo -n "main" > $(results.source-branch.path)
                echo -n "true" > $(results.operator-pr-included.path)
              else
                # No operator change in flight, so the operator source is whatever
                # is already released: fork from stable.
                summarise "not included" "stable" "will run" \
                  "the leader PR changes ${PR_COUNT} component(s) but not the operator, so the operator is rebuilt from stable against them"
                echo -n "stable" > $(results.source-branch.path)
                echo -n "false" > $(results.skip-eg-build.path)
                echo -n "false" > $(results.operator-pr-included.path)
              fi
      workspaces:
        - name: github-credentials
          workspace: github-credentials
    - name: create-ephemeral-branch
      params:
        - name: repo
          value: $(params.operator-repo)
        - name: source-branch
          value: $(tasks.check-leader-pr.results.source-branch)
        - name: branch-name
          value: eg-$(params.leader-pr-number)
      runAfter:
        - check-leader-pr
      taskSpec:
        params:
          - name: repo
            type: string
          - name: source-branch
            type: string
          - name: branch-name
            type: string
        results:
          - name: branch-name
            description: Name of the created ephemeral branch
          - name: branch-sha
            description: SHA of the branch head
        workspaces:
          - name: github-credentials
            description: Secret workspace holding a 'token' key with a GitHub API token
            optional: true
        steps:
          - name: create-branch
            image: registry.access.redhat.com/ubi9/ubi-minimal:latest
            script: |
              #!/bin/bash
              set -euo pipefail

              REPO="$(params.repo)"
              SOURCE="$(params.source-branch)"
              BRANCH="$(params.branch-name)"
              TOKEN=$(cat "$(workspaces.github-credentials.path)/token")

              # Get source branch SHA.  The ref response carries a single "sha" key,
              # inside .object.  Tolerate both compact and pretty-printed JSON.
              SOURCE_SHA=$(curl -sS -H "Authorization: token ${TOKEN}" \
                "https://api.github.com/repos/${REPO}/git/ref/heads/${SOURCE}" \
                | grep -o '"sha"[[:space:]]*:[[:space:]]*"[^"]*"' | head -1 | cut -d'"' -f4 || true)

              if [ -z "${SOURCE_SHA}" ]; then
                echo "Could not resolve head of ${SOURCE} in ${REPO}. Check the branch exists and the token has read access." >&2
                exit 1
              fi
              echo "Source ${SOURCE} is at ${SOURCE_SHA}"

              # Try to create the branch; if it already exists, force it to match.
              HTTP_CODE=$(curl -sS -o /dev/null -w "%{http_code}" \
                -H "Authorization: token ${TOKEN}" \
                -X POST "https://api.github.com/repos/${REPO}/git/refs" \
                -d "{\"ref\":\"refs/heads/${BRANCH}\",\"sha\":\"${SOURCE_SHA}\"}")

              if [ "${HTTP_CODE}" = "422" ]; then
                echo "Branch ${BRANCH} already exists - resetting it to ${SOURCE_SHA}"
                PATCH_CODE=$(curl -sS -o /dev/null -w "%{http_code}" \
                  -H "Authorization: token ${TOKEN}" \
                  -X PATCH "https://api.github.com/repos/${REPO}/git/refs/heads/${BRANCH}" \
                  -d "{\"sha\":\"${SOURCE_SHA}\",\"force\":true}")
                if [ "${PATCH_CODE}" != "200" ]; then
                  echo "Failed to reset ${BRANCH} (HTTP ${PATCH_CODE})" >&2
                  exit 1
                fi
              elif [ "${HTTP_CODE}" != "201" ]; then
                echo "Failed to create ${BRANCH} (HTTP ${HTTP_CODE})" >&2
                exit 1
              fi

              echo -n "${BRANCH}" > $(results.branch-name.path)
              echo -n "${SOURCE_SHA}" > $(results.branch-sha.path)
      workspaces:
        - name: github-credentials
          workspace: github-credentials
      when:
        - input: $(tasks.check-leader-pr.results.skip-eg-build)
          operator: notin
          values:
            - "true"
        - input: $(params.enable-eg-orchestration)
          operator: in
          values:
            - "true"
    - name: trigger-operator-processor
      params:
        - name: repo
          value: $(params.operator-repo)
        - name: branch-name
          value: eg-$(params.leader-pr-number)
        - name: leader-pr-number
          value: $(params.leader-pr-number)
      runAfter:
        - create-ephemeral-branch
      taskSpec:
        params:
          - name: repo
            type: string
          - name: branch-name
            type: string
          - name: leader-pr-number
            type: string
        results:
          - name: status
            description: success or failure
        workspaces:
          - name: github-credentials
            description: Secret workspace holding a 'token' key with a GitHub API token
            optional: true
        steps:
          - name: dispatch-and-wait
            image: registry.access.redhat.com/ubi9/ubi-minimal:latest
            script: |
              #!/bin/bash
              set -euo pipefail

              REPO="$(params.repo)"
              BRANCH="$(params.branch-name)"
              TOKEN=$(cat "$(workspaces.github-credentials.path)/token")

              RUNS_URL="https://api.github.com/repos/${REPO}/actions/runs?branch=${BRANCH}&event=workflow_dispatch&per_page=1"

              latest_run_id() {
                curl -sS -H "Authorization: token ${TOKEN}" "${RUNS_URL}" \
                  | grep -o '"id"[[:space:]]*:[[:space:]]*[0-9]*' | head -1 | tr -cd '0-9' || true
              }

              # Record the newest pre-existing run so a previous run on this branch is
              # never mistaken for ours - otherwise a stale success would pass the gate
              # instantly without operator-processor having run at all.
              PREV_ID=$(latest_run_id)
              echo "Newest pre-existing workflow_dispatch run on ${BRANCH}: ${PREV_ID:-none}"

              DISPATCH_CODE=$(curl -sS -o /dev/null -w "%{http_code}" \
                -H "Authorization: token ${TOKEN}" \
                -X POST "https://api.github.com/repos/${REPO}/actions/workflows/operator-processor.yaml/dispatches" \
                -d "{\"ref\":\"${BRANCH}\",\"inputs\":{\"eg-mode\":\"true\",\"eg-branch\":\"${BRANCH}\",\"leader-pr-number\":\"$(params.leader-pr-number)\"}}")

              if [ "${DISPATCH_CODE}" != "204" ]; then
                echo "workflow_dispatch was not accepted (HTTP ${DISPATCH_CODE})" >&2
                echo -n "failure" > $(results.status.path)
                exit 1
              fi
              echo "Dispatched operator-processor on ${BRANCH}"

              # Wait for the new run to be registered.
              sleep 10

              # Poll for completion (max 20 min).
              for i in $(seq 1 40); do
                RESP=$(curl -sS -H "Authorization: token ${TOKEN}" "${RUNS_URL}")
                RUN_ID=$(echo "${RESP}" | grep -o '"id"[[:space:]]*:[[:space:]]*[0-9]*' | head -1 | tr -cd '0-9' || true)

                if [ -n "${RUN_ID}" ] && [ "${RUN_ID}" != "${PREV_ID}" ]; then
                  # "conclusion" is null while in progress, so this stays empty until done.
                  STATUS=$(echo "${RESP}" | grep -o '"conclusion"[[:space:]]*:[[:space:]]*"[^"]*"' | head -1 | cut -d'"' -f4 || true)

                  if [ "${STATUS}" = "success" ]; then
                    echo -n "success" > $(results.status.path)
                    exit 0
                  elif [ -n "${STATUS}" ]; then
                    echo "operator-processor run ${RUN_ID} concluded: ${STATUS}" >&2
                    echo -n "failure" > $(results.status.path)
                    exit 1
                  fi
                fi

                echo "Waiting for operator-processor... attempt $i/40"
                sleep 30
              done

              echo "Timed out after 20 minutes waiting for operator-processor" >&2
              echo -n "timeout" > $(results.status.path)
              exit 1
      workspaces:
        - name: github-credentials
          workspace: github-credentials
      when:
        - input: $(tasks.check-leader-pr.results.skip-eg-build)
          operator: notin
          values:
            - "true"
        - input: $(params.enable-eg-orchestration)
          operator: in
          values:
            - "true"
    - name: get-latest-commit
      params:
        - name: enable-eg-orchestration
          value: $(params.enable-eg-orchestration)
        - name: skip-eg-build
          value: $(tasks.check-leader-pr.results.skip-eg-build)
        - name: repo
          value: $(params.operator-repo)
        - name: branch-name
          value: eg-$(params.leader-pr-number)
        - name: forked-from
          value: $(tasks.check-leader-pr.results.source-branch)
        - name: operator-pr-included
          value: $(tasks.check-leader-pr.results.operator-pr-included)
        - name: git-url
          value: $(params.git-url)
        - name: revision
          value: $(params.revision)
        - name: output-image
          value: $(params.output-image)
      runAfter:
        - trigger-operator-processor
      taskSpec:
        description: |
          Resolves the git-url, revision and image tag the build should use.

          This task deliberately has no `when` guard: clone-repository consumes its
          results, and in Tekton a task that references the results of a skipped
          task is itself skipped.  Guarding this task would therefore skip the whole
          build in direct mode.  It runs in both modes and branches internally.

          It is also the only place that can name the built image correctly.  The
          caller's output-image is tagged with the PaC `{{revision}}` - the head of
          the pull request that triggered the run - which is expanded before the
          ephemeral branch exists and is therefore never the commit that gets built
          in EG mode.  This task re-tags it with the revision it just resolved, so
          the image tag and the provenance agree.
        params:
          - name: enable-eg-orchestration
            type: string
          - name: skip-eg-build
            type: string
          - name: repo
            type: string
          - name: branch-name
            type: string
          - name: forked-from
            type: string
          - name: operator-pr-included
            type: string
          - name: git-url
            type: string
          - name: revision
            type: string
          - name: output-image
            type: string
        results:
          - name: commit-sha
            description: Revision to build - ephemeral branch HEAD in EG mode, the caller's revision otherwise
          - name: git-url
            description: Repository to clone - operator-repo in EG mode, the caller's git-url otherwise
          - name: source-branch
            description: Branch the revision was read from - the ephemeral branch in EG mode, the caller's revision otherwise
          - name: source-branch-url
            description: |
              Link to that branch.  Valid while the build runs; the finally task
              deletes the ephemeral branch afterwards, so use commit-url for a
              permanent reference.
          - name: commit-url
            description: Permanent link to the exact commit that is being built
          - name: image-ref
            description: |
              Image to build and push, re-tagged with the resolved revision.  Equal
              to output-image in direct mode.
        workspaces:
          - name: github-credentials
            optional: true
            description: Secret workspace holding a 'token' key. Only read in EG mode.
        steps:
          - name: get-sha
            image: registry.access.redhat.com/ubi9/ubi-minimal:latest
            script: |
              #!/bin/bash
              set -euo pipefail

              OUTPUT_IMAGE="$(params.output-image)"

              # Strip the tag off an image ref, leaving registry/namespace/repo.
              # A colon is only a tag separator if nothing after it looks like a
              # path - otherwise it is a registry port on an untagged ref.
              image_repo() {
                local ref="$1" last="${1##*:}"
                if [ "${last}" = "${ref}" ] || [ "${last}" != "${last#*/}" ]; then
                  printf '%s' "${ref}"
                else
                  printf '%s' "${ref%:*}"
                fi
              }

              if [ "$(params.enable-eg-orchestration)" != "true" ]; then
                # Direct mode: build exactly what the caller asked for, under the
                # name they asked for.  No GitHub API call, no token required.
                echo "EG orchestration disabled - building $(params.revision) from $(params.git-url)"
                echo -n "$(params.revision)" > $(results.commit-sha.path)
                echo -n "$(params.git-url)" > $(results.git-url.path)
                echo -n "$(params.revision)" > $(results.source-branch.path)
                echo -n "" > $(results.source-branch-url.path)
                echo -n "" > $(results.commit-url.path)
                echo -n "${OUTPUT_IMAGE}" > $(results.image-ref.path)
                exit 0
              fi

              # Single-PR skip: no ephemeral branch was created, so there is no HEAD
              # to resolve.  Everything downstream is skipped by the same result, so
              # these values go unused - they exist only so this task does not fail.
              if [ "$(params.skip-eg-build)" = "true" ]; then
                echo "EG build skipped - passing the caller's revision through unused"
                echo -n "$(params.revision)" > $(results.commit-sha.path)
                echo -n "$(params.git-url)" > $(results.git-url.path)
                echo -n "" > $(results.source-branch.path)
                echo -n "" > $(results.source-branch-url.path)
                echo -n "" > $(results.commit-url.path)
                echo -n "${OUTPUT_IMAGE}" > $(results.image-ref.path)
                exit 0
              fi

              # EG mode: operator-processor has pushed new commits, so re-read HEAD.
              TOKEN=$(cat "$(workspaces.github-credentials.path)/token")

              SHA=$(curl -sS -H "Authorization: token ${TOKEN}" \
                "https://api.github.com/repos/$(params.repo)/git/ref/heads/$(params.branch-name)" \
                | grep -o '"sha"[[:space:]]*:[[:space:]]*"[^"]*"' | head -1 | cut -d'"' -f4 || true)

              if [ -z "${SHA}" ]; then
                echo "Could not resolve head of $(params.branch-name) in $(params.repo)" >&2
                exit 1
              fi

              BRANCH_URL="https://github.com/$(params.repo)/tree/$(params.branch-name)"
              COMMIT_URL="https://github.com/$(params.repo)/commit/${SHA}"
              IMAGE_REF="$(image_repo "${OUTPUT_IMAGE}"):eg-${SHA}"

              # Say plainly where the bits came from.  Without this the only commit
              # visible in the logs is the PaC revision, which is a different commit
              # in a different repo from the one actually being built.
              if [ "$(params.operator-pr-included)" = "true" ]; then
                WHY="the leader PR includes an operator PR"
              else
                WHY="the leader PR includes no operator PR"
              fi

              echo "Building from:"
              echo "  repo          $(params.repo)"
              echo "  branch        $(params.branch-name)"
              echo "  forked from   $(params.forked-from)  (${WHY})"
              echo "  commit        ${SHA}"
              echo "  branch url    ${BRANCH_URL}"
              echo "  commit url    ${COMMIT_URL}"
              echo "  image         ${IMAGE_REF}"
              echo "The caller's output-image was ${OUTPUT_IMAGE}; its tag names the"
              echo "pull request head, not this commit, so it has been re-tagged."

              echo -n "${SHA}" > $(results.commit-sha.path)
              echo -n "https://github.com/$(params.repo).git" > $(results.git-url.path)
              echo -n "$(params.branch-name)" > $(results.source-branch.path)
              echo -n "${BRANCH_URL}" > $(results.source-branch-url.path)
              echo -n "${COMMIT_URL}" > $(results.commit-url.path)
              echo -n "${IMAGE_REF}" > $(results.image-ref.path)
      workspaces:
        - name: github-credentials
          workspace: github-credentials
    - name: init
