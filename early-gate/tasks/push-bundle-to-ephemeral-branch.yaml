apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: push-bundle-to-ephemeral-branch
spec:
  description: |
    Commits the processed bundle to the ephemeral branch, which is what triggers
    the PaC bundle build (DR-1c, DR-1d).

    This is the task that replaces the `git push origin HEAD:rhoai-X.Y` at the end
    of process-operator-bundle.yaml.  Same effect - processed bundle content in
    git, a build triggered off it - with the destination changed from the release
    branch to a throwaway ref.

    Three things make it structurally unable to write to a release branch:

      1. It clones the ephemeral branch and pushes back to the branch it cloned.
         There is no branch name in the push that was not in the fetch.
      2. The eg-* name check is repeated here rather than trusted from
         create-ephemeral-branch, because this is the task holding a write token.
      3. There is no force flag.  process-operator-bundle.yaml has one; a
         fast-forward onto a branch this pipeline created moments ago does not
         need it, and its absence means a surprise on the remote fails the task
         instead of being overwritten.

    Cloning fresh rather than reusing the .git directory inside the trusted
    artifact is deliberate: it makes the task independent of whether the artifact
    carried git metadata, and it means the commit is built on the ephemeral
    branch's real head rather than on a detached release-branch checkout that
    merely happens to have the same tree.

    The commit is made with --allow-empty and an "early-gate:" subject.  A gate
    whose components all happen to match the release digests still has to produce
    a bundle build - "nothing changed" is a valid gate result, not a reason to
    skip the build - and the subject line is what the PaC CEL matches on when
    there is no file diff to match instead.
  params:
  - name: SOURCE_ARTIFACT
    type: string
    description: Trusted artifact holding the processed working tree
  - name: repo
    type: string
    description: org/repo to push to, e.g. red-hat-data-services/RHOAI-Build-Config
  - name: branch-name
    type: string
    description: The ephemeral branch created by create-ephemeral-branch
  - name: commit-message
    type: string
    default: "early-gate: pin bundle to gated component digests"
    description: |
      Commit subject. Must start with "early-gate:" - the PaC CEL on the bundle
      PipelineRun matches on it so that an empty commit still triggers a build.
  - name: paths
    type: string
    default: "bundle config"
    description: |
      Space-separated paths, relative to the repo root, to copy out of the
      artifact and commit.  Narrow on purpose: the processor only writes under
      bundle/ and config/, and anything else appearing in the diff would mean
      something went wrong.
  results:
  - name: commit-sha
    description: The commit pushed to the ephemeral branch
  - name: branch-name
    description: The branch that was pushed to
  workspaces:
  - name: github-credentials
    description: Secret workspace holding a 'token' key with a GitHub API token
  volumes:
  - name: workdir
    emptyDir: {}
  stepTemplate:
    volumeMounts:
    - mountPath: /var/workdir
      name: workdir
  steps:
  - name: use-trusted-artifact
    image: quay.io/redhat-appstudio/build-trusted-artifacts:latest@sha256:81c4864dae6bb11595f657be887e205262e70086a05ed16ada827fd6391926ac
    args:
    - use
    - $(params.SOURCE_ARTIFACT)=/var/workdir/source

  - name: commit-and-push
    image: registry.access.redhat.com/ubi9/ubi-minimal:latest
    env:
    - name: REPO
      value: $(params.repo)
    - name: BRANCH
      value: $(params.branch-name)
    - name: COMMIT_MESSAGE
      value: $(params.commit-message)
    - name: PATHS
      value: $(params.paths)
    script: |
      #!/bin/bash
      set -euo pipefail

      microdnf install -y git tar >/dev/null

      case "${BRANCH}" in
        eg-*) ;;
        *)
          echo "Refusing to push to '${BRANCH}': an early-gate run writes only to eg-* branches (DR-1c)." >&2
          exit 1
          ;;
      esac

      case "${COMMIT_MESSAGE}" in
        early-gate:*) ;;
        *)
          echo "commit-message must start with 'early-gate:' so the PaC CEL matches an empty commit." >&2
          exit 1
          ;;
      esac

      # Credentials go in a file, never on a command line or in a remote URL, so
      # they cannot surface in `ps`, in git's own error output, or in a task log.
      TOKEN=$(cat "$(workspaces.github-credentials.path)/token")
      export HOME=/var/workdir
      git config --global credential.helper 'store --file=/var/workdir/.git-credentials'
      ( umask 077; printf 'https://x-access-token:%s@github.com\n' "${TOKEN}" > /var/workdir/.git-credentials )
      unset TOKEN

      git config --global user.name  "rhoai-early-gate[bot]"
      git config --global user.email "rhoai-early-gate@users.noreply.github.com"

      PUSH_DIR=/var/workdir/push
      git clone --depth 1 --branch "${BRANCH}" "https://github.com/${REPO}.git" "${PUSH_DIR}"

      # Copy the processed paths over the ephemeral branch checkout.  Each path is
      # removed first so a manifest the processor dropped does not survive as a
      # stale file in the commit.
      #
      # ADD_PATHS accumulates only the paths that exist afterwards: `git add -- X`
      # on a pathspec that matches nothing is a fatal error, which would turn a
      # harmless "this branch has no config/ directory" into a failed gate.
      ADD_PATHS=()
      for p in ${PATHS}; do
        if [ -e "/var/workdir/source/${p}" ]; then
          rm -rf "${PUSH_DIR:?}/${p}"
          cp -r "/var/workdir/source/${p}" "${PUSH_DIR}/${p}"
        elif [ ! -e "${PUSH_DIR}/${p}" ]; then
          echo "Path '${p}' is in neither the artifact nor the branch; skipping it."
          continue
        else
          echo "Path '${p}' is not in the processed artifact; leaving the branch's copy alone."
        fi
        ADD_PATHS+=("${p}")
      done

      if [ ${#ADD_PATHS[@]} -eq 0 ]; then
        echo "None of '${PATHS}' exist to commit. The processed artifact is not what this task expects." >&2
        exit 1
      fi

      cd "${PUSH_DIR}"
      git add -A -- "${ADD_PATHS[@]}"

      echo "=== diff against ${BRANCH} ==="
      git --no-pager diff --cached --stat
      echo "=============================="

      # --allow-empty: see the task description. A no-change gate still builds.
      git commit --allow-empty -m "${COMMIT_MESSAGE}"

      SHA=$(git rev-parse HEAD)
      echo "Pushing ${SHA} to ${REPO} ${BRANCH}"
      git push origin "HEAD:${BRANCH}"

      # The credentials file lives on an emptyDir shared with later steps in this
      # task only, but there is no reason for it to outlive the push.
      rm -f /var/workdir/.git-credentials

      echo -n "${SHA}"    > "$(results.commit-sha.path)"
      echo -n "${BRANCH}" > "$(results.branch-name.path)"
