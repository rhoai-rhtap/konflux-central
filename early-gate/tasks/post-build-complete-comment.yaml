---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: post-build-complete-comment
  labels:
    app.kubernetes.io/version: "0.1"
spec:
  description: |
    RHOAI adaptation of opendatahub-io/odh-konflux-central's
    early-gate/tasks/post-build-complete-comment.yaml.  Posts the gate's
    verdict as a comment on the leader PR.

    Four things differ from upstream, and all four follow from this gate
    having three blocks where ODH has one.

    1. Upstream reads the PR off the pipelinesascode.tekton.dev labels,
       because it always runs inside a PaC-triggered PipelineRun.  This gate
       is driven by the Leader PR Manager, so leader-pr-repo and
       leader-pr-number are passed in - the same change
       resolve-group-configuration already carries.

    2. Upstream takes its token from a secretKeyRef.  Here it comes from the
       github-credentials workspace, which is what every other task in this
       pipeline reads and what the eg-github-token secret is already mounted
       as.  One credential path, not two.

    3. Upstream reports one image, the FBC fragment.  This reports all three
       block outputs by digest, with the DR-6/DR-F6 verification state
       alongside the two that have one.

    4. Upstream runs in the tasks section after the build, so it only ever
       posts on success.  This runs from finally and takes a status param, so
       a failed gate says so on the PR instead of going quiet.  See the two
       call sites in early-gate-component-pipeline.yaml for why that needs
       two invocations rather than one.

    Every artifact param defaults to empty.  The failure call site passes
    almost none of them - a finally task that references a result of a task
    that failed is skipped by Tekton, which is precisely the run that most
    needs a comment - so the body has to render from statuses alone.
  workspaces:
  - name: github-credentials
    description: Secret workspace holding a 'token' key with a GitHub API token
  params:

  # --- Where to post ---
  - name: leader-pr-repo
    type: string
    description: org/repo of the promoter repository holding the leader PR
  - name: leader-pr-number
    type: string
    description: Leader PR number to comment on

  # --- Verdict ---
  - name: status
    type: string
    description: |
      "success" or "failure".  Decides the heading and whether the artifact
      table is rendered at all; anything else is treated as a failure.

  # --- Run context ---
  - name: rhoai-version
    type: string
    default: ""
  - name: eg-branch
    type: string
    default: ""
    description: The ephemeral operator branch, already deleted by the time
      this runs.  Reported because the image tags embed it.
  - name: source-branch
    type: string
    default: ""
    description: What resolve-group-configuration decided to fork from
  - name: fallback-source-branch
    type: string
    default: ""
    description: |
      Compared against source-branch to decide whether to label the run as
      having fallen back.  This is the branch-level fallback - the gate could
      not find an operator PR in the group, so it built the release branch's
      operator instead.  Distinct from fallback-warning below, which is about
      individual component images, and the comment says which is which.
  - name: operator-pr-included
    type: string
    default: ""
  - name: pipelinerun-name
    type: string
    default: ""

  # --- Block outputs ---
  - name: operator-image
    type: string
    default: ""
    description: OPERATOR_IMAGE_REF_BY_DIGEST
  - name: bundle-image
    type: string
    default: ""
    description: BUNDLE_IMAGE_REF_BY_DIGEST
  - name: bundle-verified
    type: string
    default: ""
  - name: bundle-build-url
    type: string
    default: ""
  - name: fbc-image
    type: string
    default: ""
    description: FBC_IMAGE_REF_BY_DIGEST - what a smoke test installs from
  - name: fbc-verified
    type: string
    default: ""
  - name: fbc-build-url
    type: string
    default: ""
  - name: fbc-catalog-path
    type: string
    default: ""

  # --- Per-block Tekton status, for the failure path ---
  # $(tasks.<name>.status) is readable from finally whatever happened to the
  # task, which is why the failure call site can name the block that broke
  # without consuming a single result.
  - name: operator-task-status
    type: string
    default: ""
  - name: bundle-task-status
    type: string
    default: ""
  - name: fbc-task-status
    type: string
    default: ""
  - name: bundle-verify-status
    type: string
    default: ""
  - name: fbc-verify-status
    type: string
    default: ""

  # --- Group testing, as upstream ---
  - name: has-group-config
    type: string
    default: "false"
  - name: component-count
    type: string
    default: ""
  - name: component-table
    type: string
    default: ""
    description: TSV-ish table from generate-snapshot, pr|comp|tag|status|digest
  - name: fallback-warning
    type: string
    default: ""
    description: |
      generate-snapshot's note about components whose PR build was not ready,
      so the snapshot used the release tag instead.  Image-level fallback, as
      opposed to the branch-level one described on fallback-source-branch.
  - name: invalid-repo-warnings
    type: string
    default: ""
  - name: format-help-warning
    type: string
    default: ""
  - name: omitted-components
    type: string
    default: ""
  - name: component-pr-org
    type: string
    default: "red-hat-data-services"
    description: |
      Org the group's component PRs live in, used only to build links.
      Upstream hardcodes opendatahub-io; here the child PRs are in
      red-hat-data-services while the forks the gate builds are in
      rhoai-rhtap, so the two cannot be the same constant.
  - name: component-map-url
    type: string
    default: "https://raw.githubusercontent.com/rhoai-rhtap/konflux-central/main/config/component_repo_map.json"
    description: |
      Used to turn a component name back into a repo for the PR link.
      Fetched anonymously and allowed to fail - the table degrades to bare
      PR numbers rather than the task failing over a cosmetic link.

  steps:
  - name: post-comment
    image: quay.io/konflux-ci/konflux-test:stable
    env:
    - name: LEADER_PR_REPO
      value: $(params.leader-pr-repo)
    - name: LEADER_PR_NUMBER
      value: $(params.leader-pr-number)
    - name: STATUS
      value: $(params.status)
    - name: RHOAI_VERSION
      value: $(params.rhoai-version)
    - name: EG_BRANCH
      value: $(params.eg-branch)
    - name: SOURCE_BRANCH
      value: $(params.source-branch)
    - name: FALLBACK_SOURCE_BRANCH
      value: $(params.fallback-source-branch)
    - name: OPERATOR_PR_INCLUDED
      value: $(params.operator-pr-included)
    - name: PIPELINERUN_NAME
      value: $(params.pipelinerun-name)
    - name: OPERATOR_IMAGE
      value: $(params.operator-image)
    - name: BUNDLE_IMAGE
      value: $(params.bundle-image)
    - name: BUNDLE_VERIFIED
      value: $(params.bundle-verified)
    - name: BUNDLE_BUILD_URL
      value: $(params.bundle-build-url)
    - name: FBC_IMAGE
      value: $(params.fbc-image)
    - name: FBC_VERIFIED
      value: $(params.fbc-verified)
    - name: FBC_BUILD_URL
      value: $(params.fbc-build-url)
    - name: FBC_CATALOG_PATH
      value: $(params.fbc-catalog-path)
    - name: OPERATOR_TASK_STATUS
      value: $(params.operator-task-status)
    - name: BUNDLE_TASK_STATUS
      value: $(params.bundle-task-status)
    - name: FBC_TASK_STATUS
      value: $(params.fbc-task-status)
    - name: BUNDLE_VERIFY_STATUS
      value: $(params.bundle-verify-status)
    - name: FBC_VERIFY_STATUS
      value: $(params.fbc-verify-status)
    - name: HAS_GROUP_CONFIG
      value: $(params.has-group-config)
    - name: COMPONENT_COUNT
      value: $(params.component-count)
    - name: COMPONENT_TABLE
      value: $(params.component-table)
    - name: FALLBACK_WARNING
      value: $(params.fallback-warning)
    - name: INVALID_REPO_WARNINGS
      value: $(params.invalid-repo-warnings)
    - name: FORMAT_HELP_WARNING
      value: $(params.format-help-warning)
    - name: OMITTED_COMPONENTS
      value: $(params.omitted-components)
    - name: COMPONENT_PR_ORG
      value: $(params.component-pr-org)
    - name: COMPONENT_MAP_URL
      value: $(params.component-map-url)
    - name: GITHUB_CREDENTIALS_PATH
      value: $(workspaces.github-credentials.path)
    script: |
      #!/bin/bash
      # No set -x anywhere in this script, deliberately: the token is read a
      # few lines down and a trace would put it in the task log.
      set -euo pipefail

      BODY=/tmp/comment.md
      : > "${BODY}"

      # Markdown table cells cannot contain a newline or an unescaped pipe,
      # and most of what goes in them arrives as a free-text param.  Used on
      # everything that lands inside a | ... | cell.
      cell() {
        printf '%s' "$1" | tr '\n' ' ' | sed 's/|/\\|/g; s/[[:space:]]\+/ /g; s/^ //; s/ $//'
      }

      trimmed() {
        printf '%s' "$1" | sed 's/^[[:space:]]*//; s/[[:space:]]*$//'
      }

      # --- Heading -------------------------------------------------------
      VERSION_SUFFIX=""
      if [ -n "${RHOAI_VERSION}" ]; then
        VERSION_SUFFIX=" — \`${RHOAI_VERSION}\`"
      fi

      if [ "${STATUS}" = "success" ]; then
        HEADING=":white_check_mark: **Early Gate passed**${VERSION_SUFFIX}"
        STATUS_CELL=":white_check_mark: SUCCESS"
      else
        HEADING=":x: **Early Gate failed**${VERSION_SUFFIX}"
        STATUS_CELL=":x: FAILED"
      fi

      {
        echo "<!-- early-gate-build-complete -->"
        echo "${HEADING}"
        echo
        echo "| Field | Value |"
        echo "|-------|-------|"
        echo "| **Status** | ${STATUS_CELL} |"
      } >> "${BODY}"

      # --- Where the operator source came from ---------------------------
      # Two different things get called "fallback" around this gate, and
      # conflating them has already cost one debugging session: this one is
      # "no operator PR in the group, so the gate built the release branch's
      # operator".  The other, further down, is "a component's PR image was
      # not ready, so the snapshot used its release tag".
      if [ -n "${SOURCE_BRANCH}" ]; then
        FORKED="\`${SOURCE_BRANCH}\`"
        if [ -n "${FALLBACK_SOURCE_BRANCH}" ] && \
           [ "${SOURCE_BRANCH}" = "${FALLBACK_SOURCE_BRANCH}" ] && \
           [ "${OPERATOR_PR_INCLUDED}" != "true" ]; then
          FORKED="${FORKED} _(fallback — the leader PR carries no operator PR)_"
        fi
        echo "| **Forked from** | ${FORKED} |" >> "${BODY}"
      fi

      if [ -n "${EG_BRANCH}" ]; then
        echo "| **Ephemeral branch** | \`${EG_BRANCH}\` _(deleted when the run finished)_ |" >> "${BODY}"
      fi
      if [ -n "${PIPELINERUN_NAME}" ]; then
        echo "| **PipelineRun** | \`${PIPELINERUN_NAME}\` |" >> "${BODY}"
      fi

      # --- Artifacts, or the block that broke ----------------------------
      verdict() {
        case "$1" in
          true)  printf ':white_check_mark:' ;;
          false) printf ':x:' ;;
          *)     printf '—' ;;
        esac
      }

      if [ -n "${OPERATOR_IMAGE}${BUNDLE_IMAGE}${FBC_IMAGE}" ]; then
        {
          echo
          echo "**Artifacts**"
          echo
          echo "| Block | Image (by digest) | Verified |"
          echo "|-------|-------------------|----------|"
          echo "| 1 · Operator | \`$(cell "${OPERATOR_IMAGE:---}")\` | — |"
          echo "| 2 · Bundle | \`$(cell "${BUNDLE_IMAGE:---}")\` | $(verdict "${BUNDLE_VERIFIED}") |"
          echo "| 3 · FBC | \`$(cell "${FBC_IMAGE:---}")\` | $(verdict "${FBC_VERIFIED}") |"
        } >> "${BODY}"

        if [ -n "${FBC_IMAGE}" ]; then
          # printf rather than echo for the whole sentence: the catalog path is
          # a mid-sentence clause, and an echo would end the line before it.
          CATALOG_CLAUSE=""
          if [ -n "${FBC_CATALOG_PATH}" ]; then
            CATALOG_CLAUSE=" (regenerated from \`${FBC_CATALOG_PATH}\`)"
          fi
          {
            echo
            printf 'Install the catalog from the Block 3 image%s.\n' "${CATALOG_CLAUSE}"
          } >> "${BODY}"
        fi
      else
        # Failure path.  No results are readable here, so the only thing that
        # can be said about each block is its Tekton status - which is enough
        # to point at the one that broke.
        block_state() {
          case "$1" in
            Succeeded) printf ':white_check_mark: passed' ;;
            Failed)    printf ':x: failed' ;;
            None|"")   printf '— did not run' ;;
            *)         printf '%s' "$1" ;;
          esac
        }
        {
          echo
          echo "**Blocks**"
          echo
          echo "| Block | Build | DR-6 verification |"
          echo "|-------|-------|-------------------|"
          echo "| 1 · Operator | $(block_state "${OPERATOR_TASK_STATUS}") | n/a |"
          echo "| 2 · Bundle | $(block_state "${BUNDLE_TASK_STATUS}") | $(block_state "${BUNDLE_VERIFY_STATUS}") |"
          echo "| 3 · FBC | $(block_state "${FBC_TASK_STATUS}") | $(block_state "${FBC_VERIFY_STATUS}") |"
          echo
          echo "Digests are not reported on a failed run: Tekton skips a \`finally\`"
          echo "task that references a result of a task that failed, so this comment"
          echo "is built from task statuses alone.  Open the PipelineRun for the"
          echo "images the blocks that did pass produced."
        } >> "${BODY}"
      fi

      # --- Build links ---------------------------------------------------
      LINKS=""
      [ -n "${BUNDLE_BUILD_URL}" ] && LINKS="${LINKS}[Bundle build](${BUNDLE_BUILD_URL}) · "
      [ -n "${FBC_BUILD_URL}" ]    && LINKS="${LINKS}[FBC build](${FBC_BUILD_URL}) · "
      if [ -n "${LINKS}" ]; then
        {
          echo
          printf '%s\n' "${LINKS% · }"
        } >> "${BODY}"
      fi

      # --- Group testing summary, as upstream ----------------------------
      TRIMMED_FORMAT_HELP=$(trimmed "${FORMAT_HELP_WARNING}")

      if [ "${HAS_GROUP_CONFIG}" = "true" ] && [ -n "${COMPONENT_TABLE}" ]; then
        COMPONENT_MAP=$(curl -sSf "${COMPONENT_MAP_URL}" 2>/dev/null || echo "{}")

        {
          echo
          echo "---"
          echo
          if [ -n "${COMPONENT_COUNT}" ]; then
            echo "**Group Testing Summary** — ${COMPONENT_COUNT} repositories tested together"
          else
            echo "**Group Testing Summary**"
          fi
          echo
          echo "| PR | Component | Tag | Status | Digest |"
          echo "|---|---|---|---|---|"
        } >> "${BODY}"

        while IFS='|' read -r pr comp tag state digest; do
          [ -z "${pr}" ] && continue
          REPO_FOUND=$(echo "${COMPONENT_MAP}" \
            | jq -r --arg comp "${comp}" 'to_entries[] | select(.value | has($comp)) | .key' \
            | head -1)
          if [ -n "${REPO_FOUND}" ]; then
            PR_LINK="[#${pr}](https://github.com/${COMPONENT_PR_ORG}/${REPO_FOUND}/pull/${pr})"
          else
            PR_LINK="#${pr}"
          fi

          if [ "${state}" = "ready" ]; then
            STATUS_TEXT="PR build ready"
          else
            STATUS_TEXT="Using stable"
          fi

          echo "| ${PR_LINK} | $(cell "${comp}") | \`$(cell "${tag}")\` | ${STATUS_TEXT} | \`$(cell "${digest}")\` |" >> "${BODY}"
        done <<< "${COMPONENT_TABLE}"

        # The other fallback: component images, not the operator branch.
        if [ -n "$(trimmed "${FALLBACK_WARNING}")" ]; then
          {
            echo
            echo ":warning: Some components fell back to their stable image because"
            echo "their PR build had not finished.  Re-run the gate once those builds"
            echo "are green."
            echo
            echo "> ${FALLBACK_WARNING}"
          } >> "${BODY}"
        fi

        if [ -n "$(trimmed "${INVALID_REPO_WARNINGS}")" ]; then
          {
            echo
            echo "### Configuration Warnings"
            echo
            echo "${INVALID_REPO_WARNINGS}"
          } >> "${BODY}"
        fi
      elif [ -n "${TRIMMED_FORMAT_HELP}" ]; then
        {
          echo
          echo "---"
          echo
          echo "${FORMAT_HELP_WARNING}"
        } >> "${BODY}"
      fi

      if [ -n "$(trimmed "${OMITTED_COMPONENTS}")" ]; then
        {
          echo
          echo "<details><summary>Components left out of the snapshot</summary>"
          echo
          echo '```'
          echo "${OMITTED_COMPONENTS}"
          echo '```'
          echo
          echo "</details>"
        } >> "${BODY}"
      fi

      {
        echo
        echo "---"
        echo "Posted by Early Gate"
      } >> "${BODY}"

      echo "=== comment body ==="
      cat "${BODY}"
      echo "===================="

      # --- Post ----------------------------------------------------------
      TOKEN=$(cat "${GITHUB_CREDENTIALS_PATH}/token")

      jq -Rs '{body: .}' < "${BODY}" > /tmp/payload.json

      # Not -f/-sSf: a gate that already has its verdict should not be turned
      # red a second time because GitHub rate-limited the comment.  The code
      # is reported instead, which is what upstream does too.
      CODE=$(curl -sS -o /tmp/response.json -w '%{http_code}' \
        -X POST \
        -H "Authorization: token ${TOKEN}" \
        -H "Accept: application/vnd.github+json" \
        --data-binary @/tmp/payload.json \
        "https://api.github.com/repos/${LEADER_PR_REPO}/issues/${LEADER_PR_NUMBER}/comments")

      if [ "${CODE}" = "201" ]; then
        echo "Commented on ${LEADER_PR_REPO}#${LEADER_PR_NUMBER}"
      else
        echo "WARNING: could not comment on ${LEADER_PR_REPO}#${LEADER_PR_NUMBER} (HTTP ${CODE})" >&2
        jq -r '.message // empty' < /tmp/response.json >&2 || true
      fi
