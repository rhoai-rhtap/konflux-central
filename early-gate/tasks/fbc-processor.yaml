apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: fbc-processor
spec:
  description: |
    Runs RHOAI's fbc-processor.py over the RHOAI-Build-Config working tree,
    producing a catalog/<ocp-version>/rhods-operator/catalog.yaml that carries the
    early-gate bundle rather than the release one.

    Adapted from opendatahub-io/odh-konflux-central's early-gate/tasks/fbc-processor.yaml.
    The structure is upstream's; several details are not, because the ODH and
    RHOAI forks of RHOAI-Konflux-Automation have diverged in the same way they did
    for the bundle processor:

      upstream (odh branch)          here (main branch)
      ---------------------          ------------------
      -q <quay tag>                  -v <rhoai version>   (there is no -q)
      -v <source dir>                -v is the tag, not a path
      --catalog-build-args-file-path -cba (the long form still works)
      pcc/catalog-<ocp>.yaml         no pcc/ in this repo - see "-c" below

    DR-F2 (bundle reference configurable).  Two separate things have to be right.

      The bundle the FBC points at.  The semver template's .stable.bundles[0].image
      is overwritten with <BUNDLE_IMAGE_URL minus its tag>@<BUNDLE_IMAGE_DIGEST>,
      i.e. Block 2's output pinned by digest.  Both are required params with no
      default, and the digest is rejected below unless it is sha256-shaped - an
      empty BUNDLE_IMAGE_DIGEST is exactly the failure mode monitor-pac-build
      warns about rather than failing on, and it must not be allowed to degrade
      into "render whatever the template happened to contain".

      The tag images are looked up by.  RHOAI's processor has no -q; the knob is
      -v/--rhoai-version, used as `version_tag = self.rhoai_version` in
      snapshot_processor.get_all_latest_images.  QUAY_TAG is wired to it, is
      required, and is rejected if it looks like a release tag (DR-F2d), exactly
      as bundle-processor.yaml does for DR-3d.

    Why extract-snapshot-images is tolerated rather than required.  Its only two
    outputs are snapshot_images.json - whose bundle entry this task overwrites one
    line later, in both the release workflow and upstream's task - and
    catalog/catalog_build_args.map, which feeds the FBC image's git.url/git.commit
    LABELs.  Those are provenance, not function: catalog/vX.YY/Dockerfile declares
    every ARG with an empty default and uses them only in LABEL lines.

    On an early-gate run the lookup cannot succeed anyway.  It walks
    build-config.yaml's repo_mappings, asks quay.io/rhoai for tag ${QUAY_TAG}, and
    requires a <digest>.sig cosign signature tag alongside it.  QUAY_TAG is an
    eg-<sha> tag that exists under quay.io/redhat-user-workloads, unsigned - so
    the lookup finds nothing, and with RHOAI_QUAY_API_TOKEN empty it finds nothing
    noisily.  Making the gate depend on that would be making it depend on release
    Quay state, which is the thing DR-F2 exists to prevent.  So the step runs - it
    is part of DR-F3's four steps and its wiring is what makes QUAY_TAG traceable
    - and a non-zero exit is reported and stepped over.

    Why --purge-bundles is computed and passed.  This is the trap that would
    otherwise make the whole block a silent no-op.  fbc_processor.patch_olm_bundles
    adds the rendered bundle to the catalog only when its name is not already
    there:

        if current_bundle_name not in self.catalog_dict[SCHEMA]:
            ...
            patched = True
        return patched

    and patch_catalog_yaml writes nothing at all when patched is false - no
    catalog, no channels, no push-pipeline update.  An early-gate bundle has the
    same CSV name as the release bundle it was built from (rhods-operator.3.5.1 on
    the current gap-poc content), so the name is always already present, and the
    gate would build an FBC fragment out of unchanged release content and pass.
    Purging that name first - which __init__ does before parse_single_bundle_catalog
    runs - makes the insert happen.  The name is read back out of the rendered
    bundle rather than hardcoded, so it tracks whatever Block 2 actually produced.

    Why -c points at the branch's own catalog.  The release workflow passes
    main/pcc/catalog-<ocp>.yaml, a "previously published catalog" snapshot that
    RHOAI-Build-Config keeps on main and refreshes in a preceding job.  The POC
    fork has no pcc/ directory and no main-branch equivalent, so the base catalog
    is the one already committed on the branch - which is also what the release
    workflow itself does for its second, previous-release invocation
    (-c ${OUTPUT_CATALOG_PATH}).  Reading and writing the same path is safe:
    parse_catalog_yaml loads the whole file in __init__, long before
    write_output_catalog opens it for writing.

    No skopeo.  Upstream microdnf-installs it and runs `skopeo login -u ... -p ...`;
    quay.io/rhoai/rhoai-task-toolset:latest ships neither skopeo nor cosign (the
    same discovery that broke bundle-processor on find), and nothing here calls
    skopeo - the login was only ever a way to write a container auth file.  opm
    reads DOCKER_CONFIG directly, so the auth file is written directly, by the
    same umask-077 Python helper bundle-processor uses.  No credential reaches a
    command line, a process list or a `set -x` trace.
  params:
  - name: SOURCE_ARTIFACT
    type: string
    description: |
      Trusted artifact holding the RHOAI-Build-Config working tree, as produced by
      clone-build-config-repo.  Block 3 clones the repo fresh rather than reusing
      Block 2's artifact: the FBC reads catalog/ and config/, which bundle
      processing never touches, and a fresh clone keeps Block 3 runnable on a run
      where Block 2's artifact has already expired.
  - name: ociStorage
    type: string
    description: OCI storage location for the output artifact
  - name: ociArtifactExpiresAfter
    type: string
    default: "1h"
    description: Expiration for the output OCI artifact
  - name: BUNDLE_IMAGE_URL
    type: string
    description: |
      Block 2's bundle image by tag, as published in the pipeline's
      BUNDLE_IMAGE_URL result.  Only its repository part is used; the tag is
      stripped and replaced with BUNDLE_IMAGE_DIGEST.
  - name: BUNDLE_IMAGE_DIGEST
    type: string
    description: |
      Block 2's bundle digest, sha256:<64 hex>.  Required and validated: an FBC
      fragment references its bundle by digest, and an empty value here means
      monitor-bundle-build could not read the tag back, which must fail the gate
      rather than silently render the template's placeholder.
  - name: QUAY_TAG
    type: string
    description: |
      DR-F2.  Block 1's early-gate tag, passed to fbc-processor.py as
      -v/--rhoai-version.  Required, with no default, and rejected if it looks
      like a release tag.
  - name: BRANCH
    type: string
    description: |
      DR-F1.  The ephemeral branch this processing belongs to.  Like
      bundle-processor, the RHOAI processor has no branch concept - the branch is
      honoured by every path below pointing into a clone of it - so this is
      carried for the record, echoed into the log, and checked to be an eg-*
      name.  A release branch name here means the caller wired the wrong thing.
  - name: OPENSHIFT_VERSION
    type: string
    default: "v4.22"
    description: |
      DR-F4.  Which catalog/<version>/ directory to regenerate.  One version, not
      the four in config/build-config.yaml's supported-ocp-versions: each one is a
      separate ~41k-line catalog render plus a separate FBC image build, and the
      gate is proving that the bundle Block 2 produced can be catalogued at all,
      which one version proves as well as four.  v4.22 is the newest the POC fork
      carries, so it is also the one whose opm render path (csv-metadata, since
      422 >= the 420 cutoff) is least exercised elsewhere.
  - name: OPERATOR_BUNDLE_COMPONENT_NAME
    type: string
    default: "odh-operator-bundle"
    description: |
      Passed as -f/--image-filter to extract-snapshot-images.  odh-operator-bundle,
      not upstream's opendatahub-operator-bundle: it is matched with `in` against
      the repo_mappings keys in this repo's config/build-config.yaml.
  - name: OPERATOR_BUNDLE_IMAGE_NAME
    type: string
    default: "RELATED_IMAGE_ODH_OPERATOR_BUNDLE_IMAGE"
    description: |
      Key the bundle image is recorded under in snapshot_images.json.  Only read
      for the log line that reports what the snapshot lookup would have chosen;
      the image actually used is BUNDLE_IMAGE_URL@BUNDLE_IMAGE_DIGEST.
  - name: FBC_PUSH_PIPELINE_COMPONENT
    type: string
    default: "rhoai-fbc-fragment-gap"
    description: |
      Basename of the PaC PipelineRun file the processor is pointed at, i.e.
      .tekton/<name>-push.yaml in the build-config repo.  Like bundle-processor's
      -y, this is supplied because the constructor dereferences it
      unconditionally - fbc_processor.__init__ does
      `ruyaml.load(open(self.push_pipeline_yaml_path), ...)` with no guard - so
      omitting it aborts before any processing.  With --push-pipeline-operation
      enable and no disable marker in the file, process_push_pipeline is a no-op.
  - name: UTILS_REPO_URL
    type: string
    default: "https://github.com/red-hat-data-services/RHOAI-Konflux-Automation.git"
    description: Repo holding fbc-processor.py
  - name: UTILS_REPO_BRANCH
    type: string
    default: "main"
    description: |
      main, not upstream's odh.  The RHOAI fork's processors live on main and have
      the -v/-cba interface this task is written against.
  - name: YQ_VERSION
    type: string
    default: "v4.44.3"
  - name: OPM_VERSION
    type: string
    default: "v1.47.0"
    description: |
      Pinned to what the release workflow uses.  opm renders the catalog, so a
      different version is a different catalog.
  results:
  - name: SOURCE_ARTIFACT
    description: OCI artifact with the patched catalog in the build-config source
  - name: catalog-path
    description: Repo-relative path of the catalog that was regenerated
  - name: bundle-name
    description: olm.bundle name the rendered bundle carries, e.g. rhods-operator.3.5.1
  - name: fbc-bundle-image
    description: The by-digest bundle reference the catalog was rendered against
  volumes:
  - name: workdir
    emptyDir: {}
  stepTemplate:
    volumeMounts:
    - mountPath: /var/workdir
      name: workdir
  steps:
  - name: use-trusted-artifact
    image: quay.io/redhat-appstudio/build-trusted-artifacts:latest@sha256:81c4864dae6bb11595f657be887e205262e70086a05ed16ada827fd6391926ac
    args:
    - use
    - $(params.SOURCE_ARTIFACT)=/var/workdir/source

  - name: clone-utils
    image: quay.io/rhoai/rhoai-task-toolset:latest
    env:
    - name: UTILS_REPO_URL
      value: $(params.UTILS_REPO_URL)
    - name: UTILS_REPO_BRANCH
      value: $(params.UTILS_REPO_BRANCH)
    script: |
      #!/bin/bash
      set -eo pipefail
      echo "Cloning utils repo: ${UTILS_REPO_URL} @ ${UTILS_REPO_BRANCH}"
      git clone --depth 1 --branch "${UTILS_REPO_BRANCH}" "${UTILS_REPO_URL}" /var/workdir/utils

  - name: process-fbc
    image: quay.io/rhoai/rhoai-task-toolset:latest
    env:
    - name: BUNDLE_IMAGE_URL
      value: $(params.BUNDLE_IMAGE_URL)
    - name: BUNDLE_IMAGE_DIGEST
      value: $(params.BUNDLE_IMAGE_DIGEST)
    - name: QUAY_TAG
      value: $(params.QUAY_TAG)
    - name: BRANCH
      value: $(params.BRANCH)
    - name: OPENSHIFT_VERSION
      value: $(params.OPENSHIFT_VERSION)
    - name: OPERATOR_BUNDLE_COMPONENT_NAME
      value: $(params.OPERATOR_BUNDLE_COMPONENT_NAME)
    - name: OPERATOR_BUNDLE_IMAGE_NAME
      value: $(params.OPERATOR_BUNDLE_IMAGE_NAME)
    - name: FBC_PUSH_PIPELINE_COMPONENT
      value: $(params.FBC_PUSH_PIPELINE_COMPONENT)
    - name: YQ_VERSION
      value: $(params.YQ_VERSION)
    - name: OPM_VERSION
      value: $(params.OPM_VERSION)
    - name: CATALOG_PATH_RESULT
      value: $(results.catalog-path.path)
    - name: BUNDLE_NAME_RESULT
      value: $(results.bundle-name.path)
    - name: FBC_BUNDLE_IMAGE_RESULT
      value: $(results.fbc-bundle-image.path)
    # quay_controller derives its token env var from the Quay org:
    # re.sub(r'[^A-Za-z0-9]', '_', org).upper() + '_QUAY_API_TOKEN', and reads it
    # with os.environ[...] - no .get, no default - so an unset variable is a
    # KeyError before any request is made.  Both are optional secrets and both
    # are defaulted to "" in the script below for that reason.
    - name: RHOAI_QUAY_API_TOKEN
      valueFrom:
        secretKeyRef:
          name: early-gate-secrets
          key: RHOAI_QUAY_API_TOKEN
          optional: true
    - name: REDHAT_USER_WORKLOADS_QUAY_API_TOKEN
      valueFrom:
        secretKeyRef:
          name: early-gate-secrets
          key: REDHAT_USER_WORKLOADS_QUAY_API_TOKEN
          optional: true
    # Registry credentials for opm.  Optional: the early-gate bundle lives in
    # quay.io/redhat-user-workloads/rhoai-tenant/rhod-operator-bundle-gap, which
    # is public precisely so the unauthenticated lookups in this chain work, so
    # opm needs no credential to render it.  They are wired anyway so the same
    # task works against a private bundle repository without a code change.
    - name: RHOAI_QUAY_RO_USERNAME
      valueFrom:
        secretKeyRef:
          name: early-gate-secrets
          key: RHOAI_QUAY_RO_USERNAME
          optional: true
    - name: RHOAI_QUAY_RO_TOKEN
      valueFrom:
        secretKeyRef:
          name: early-gate-secrets
          key: RHOAI_QUAY_RO_TOKEN
          optional: true
    script: |
      #!/bin/bash
      set -eo pipefail

      SOURCE=/var/workdir/source
      UTILS=/var/workdir/utils
      BIN=/var/workdir/bin
      mkdir -p "${BIN}"
      export PATH="${BIN}:${PATH}"

      # --- DR-F2d: refuse a release-shaped tag -----------------------------
      if [ -z "${QUAY_TAG}" ]; then
        echo "QUAY_TAG is empty. It must be set explicitly to Block 1's operator tag." >&2
        exit 1
      fi
      case "${QUAY_TAG}" in
        rhoai-*|odh-stable|latest|stable|*-nightly)
          echo "QUAY_TAG='${QUAY_TAG}' looks like a release tag." >&2
          echo "An early-gate run must look images up by its own tag, never the release one (DR-F2d)." >&2
          exit 1
          ;;
      esac
      echo "QUAY_TAG (-v/--rhoai-version): ${QUAY_TAG}"

      # --- DR-F1: this processing belongs to an ephemeral branch -----------
      case "${BRANCH}" in
        eg-*) echo "Ephemeral branch: ${BRANCH}" ;;
        *)
          echo "BRANCH='${BRANCH}' is not an eg-* branch." >&2
          echo "Early-gate FBC processing only ever happens on an ephemeral branch (DR-F1)." >&2
          exit 1
          ;;
      esac

      # --- DR-F2: the bundle must arrive pinned by digest -------------------
      if [ -z "${BUNDLE_IMAGE_URL}" ]; then
        echo "BUNDLE_IMAGE_URL is empty - Block 2 produced no bundle image." >&2
        exit 1
      fi
      case "${BUNDLE_IMAGE_DIGEST}" in
        sha256:????????????????????????????????????????????????????????????????) ;;
        "")
          echo "BUNDLE_IMAGE_DIGEST is empty." >&2
          echo "monitor-bundle-build warns rather than fails when it cannot read a tag" >&2
          echo "back, so an empty digest here means the handoff Block 3 depends on did" >&2
          echo "not happen.  Rendering the semver template's placeholder instead would" >&2
          echo "produce an FBC fragment that passes the gate while testing nothing." >&2
          exit 1
          ;;
        *)
          echo "BUNDLE_IMAGE_DIGEST='${BUNDLE_IMAGE_DIGEST}' is not sha256:<64 hex>." >&2
          exit 1
          ;;
      esac

      # Strip the tag, keep the repository, pin by digest.  BUNDLE_IMAGE_URL is
      # <repo>:<tag> with no digest, so a single %:* is right; registry ports
      # are not in play here - every repository in this chain is quay.io.
      BUNDLE_IMAGE="${BUNDLE_IMAGE_URL%:*}@${BUNDLE_IMAGE_DIGEST}"
      echo "Bundle image for FBC: ${BUNDLE_IMAGE}"

      # --- Quay API tokens must be defined, not necessarily populated -------
      # See the comment on the env entries above.  quay.io answers
      # /api/v1/.../manifest/<digest>/labels anonymously for public
      # repositories, so an empty token is workable; an unset one is a
      # KeyError traceback.
      export RHOAI_QUAY_API_TOKEN="${RHOAI_QUAY_API_TOKEN:-}"
      export REDHAT_USER_WORKLOADS_QUAY_API_TOKEN="${REDHAT_USER_WORKLOADS_QUAY_API_TOKEN:-}"

      # --- Tools ------------------------------------------------------------
      # Into /var/workdir/bin rather than /usr/local/bin: the toolset image is
      # not guaranteed to be writable there, and this volume is already shared
      # with the other steps of this task.
      os="$(uname -s | tr '[:upper:]' '[:lower:]')"
      arch="$(uname -m | sed 's/x86_64/amd64/')"

      if ! command -v yq >/dev/null 2>&1; then
        echo "Downloading yq ${YQ_VERSION}"
        curl -sSfLo "${BIN}/yq" \
          "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_${os}_${arch}"
        chmod +x "${BIN}/yq"
      fi

      echo "Downloading opm ${OPM_VERSION}"
      curl -sSfLo "${BIN}/opm" \
        "https://github.com/operator-framework/operator-registry/releases/download/${OPM_VERSION}/${os}-${arch}-opm"
      chmod +x "${BIN}/opm"

      echo "Installing Python dependencies..."
      pip install --default-timeout=100 -r "${UTILS}/utils/fbc-processor/requirements.txt"

      # --- Registry auth for opm -------------------------------------------
      # Written directly rather than via `skopeo login -u ... -p ...`: that puts
      # the token in the process list and in any `set -x` trace, and the toolset
      # image has no skopeo to run it with.  opm honours DOCKER_CONFIG.
      AUTH_DIR=/var/workdir/.docker
      mkdir -p "${AUTH_DIR}"
      (
        umask 077
        python3 - "${AUTH_DIR}/config.json" <<'PYEOF'
      import base64, json, os, sys

      # registry -> (username env, secret env)
      CREDS = {
          "quay.io": ("RHOAI_QUAY_RO_USERNAME", "RHOAI_QUAY_RO_TOKEN"),
      }

      auths = {}
      for registry, (user_var, secret_var) in CREDS.items():
          user = os.environ.get(user_var, "")
          secret = os.environ.get(secret_var, "")
          if user and secret:
              token = base64.b64encode(f"{user}:{secret}".encode()).decode()
              auths[registry] = {"auth": token}

      with open(sys.argv[1], "w") as handle:
          json.dump({"auths": auths}, handle)

      # Registry names only.  Never the usernames, never the secrets.
      print("Registry auth configured for: " + (", ".join(sorted(auths)) or "<none>"))
      PYEOF
      )
      export DOCKER_CONFIG="${AUTH_DIR}"
      export REGISTRY_AUTH_FILE="${AUTH_DIR}/config.json"

      # --- Declare paths, all inside the ephemeral-branch clone (DR-F1) -----
      BUILD_CONFIG_PATH=${SOURCE}/config/build-config.yaml
      PATCH_YAML_PATH=${SOURCE}/catalog/catalog-patch.yaml
      CATALOG_BUILD_ARGS_FILE_PATH=${SOURCE}/catalog/catalog_build_args.map
      PUSH_PIPELINE_PATH=${SOURCE}/.tekton/${FBC_PUSH_PIPELINE_COMPONENT}-push.yaml
      CATALOG_REL_PATH=catalog/${OPENSHIFT_VERSION}/rhods-operator/catalog.yaml
      OUTPUT_CATALOG_PATH=${SOURCE}/${CATALOG_REL_PATH}

      for required in "${BUILD_CONFIG_PATH}" "${PATCH_YAML_PATH}" "${OUTPUT_CATALOG_PATH}"; do
        if [ ! -f "${required}" ]; then
          echo "Required input missing: ${required#${SOURCE}/}" >&2
          exit 1
        fi
      done

      if [ ! -f "${PUSH_PIPELINE_PATH}" ]; then
        echo "Missing ${PUSH_PIPELINE_PATH#${SOURCE}/}." >&2
        echo "fbc_processor.__init__ opens this file unconditionally, so its absence" >&2
        echo "aborts catalog-patch before any processing.  Either add the PaC" >&2
        echo "PipelineRun for the FBC component to the build-config repo, or point" >&2
        echo "FBC_PUSH_PIPELINE_COMPONENT at the one that is there." >&2
        exit 1
      fi

      # --- DR-F3 step 1: extract-snapshot-images ----------------------------
      # Tolerated, not required - see the task description.  Its bundle entry is
      # overwritten below either way; what it can still usefully contribute is a
      # refreshed catalog/catalog_build_args.map.
      echo "Running fbc-processor.py -op extract-snapshot-images"
      if python3 "${UTILS}/utils/fbc-processor/fbc-processor.py" \
           -op extract-snapshot-images \
           -o "${UTILS}/snapshot_images.json" \
           -v "${QUAY_TAG}" \
           -f "${OPERATOR_BUNDLE_COMPONENT_NAME}" \
           -b "${BUILD_CONFIG_PATH}" \
           --catalog-build-args-file-path "${CATALOG_BUILD_ARGS_FILE_PATH}"; then
        SNAPSHOT_BUNDLE_IMAGE=$(jq --arg name "${OPERATOR_BUNDLE_IMAGE_NAME}" -r \
          '[.[] | select(.name == $name) | .value][0] // ""' \
          "${UTILS}/snapshot_images.json" 2>/dev/null || true)
        echo "Snapshot lookup would have used: ${SNAPSHOT_BUNDLE_IMAGE:-<nothing>}"
      else
        echo "WARNING: extract-snapshot-images failed." >&2
        echo "Expected on an early-gate run: it looks tag '${QUAY_TAG}' up under" >&2
        echo "quay.io/rhoai and requires a cosign .sig tag beside it, and an" >&2
        echo "early-gate image is neither there nor signed.  Continuing - the" >&2
        echo "bundle this catalog is rendered against comes from Block 2, and" >&2
        echo "catalog_build_args.map keeps the values already on the branch." >&2
      fi

      # --- DR-F3 step 2: point the semver template at Block 2's bundle ------
      SEMVER_TEMPLATE=${UTILS}/utils/fbc-processor/fbc-semver-template.yaml
      BUNDLE_IMAGE="${BUNDLE_IMAGE}" yq e -i \
        '.stable.bundles[0].image = env(BUNDLE_IMAGE)' "${SEMVER_TEMPLATE}"
      echo "=== semver template ==="
      cat "${SEMVER_TEMPLATE}"
      echo "======================="

      # --- DR-F3 step 3: render the template with opm -----------------------
      # Two renders because the catalog format depends on the OCP version:
      # bundle-object below 4.20, csv-metadata from 4.20 up.  The release
      # workflow's cutoff is 417 and upstream's is 420; 420 is the one that
      # matches what 4.20+ clusters actually consume, so it is the one used.
      CSV_META_MIN_OCP_VERSION=420
      WORK_DIR=${UTILS}/utils/fbc
      mkdir -p "${WORK_DIR}"
      BUNDLE_OBJECT_SINGLE_BUNDLE_PATH=${WORK_DIR}/bundle_object_sbc_semver.yaml
      CSV_META_SINGLE_BUNDLE_PATH=${WORK_DIR}/csv_meta_sbc_semver.yaml

      echo "Rendering FBC template (bundle-object)..."
      opm alpha render-template semver -o yaml "${SEMVER_TEMPLATE}" \
        > "${BUNDLE_OBJECT_SINGLE_BUNDLE_PATH}"

      echo "Rendering FBC template (csv-metadata)..."
      opm alpha render-template semver --migrate-level=bundle-object-to-csv-metadata \
        -o yaml "${SEMVER_TEMPLATE}" > "${CSV_META_SINGLE_BUNDLE_PATH}"

      NUMERIC_OCP_VERSION=${OPENSHIFT_VERSION/v4./4}
      SINGLE_BUNDLE_PATH=${BUNDLE_OBJECT_SINGLE_BUNDLE_PATH}
      if [ "${NUMERIC_OCP_VERSION}" -ge "${CSV_META_MIN_OCP_VERSION}" ]; then
        SINGLE_BUNDLE_PATH=${CSV_META_SINGLE_BUNDLE_PATH}
      fi
      echo "Using ${SINGLE_BUNDLE_PATH##*/} for ${OPENSHIFT_VERSION}"

      # The olm.bundle name the render produced.  See the task description: this
      # is what has to be purged from the base catalog for patch_olm_bundles to
      # insert anything at all.
      BUNDLE_NAME=$(yq e -N 'select(.schema == "olm.bundle") | .name' \
        "${SINGLE_BUNDLE_PATH}" | head -1)
      if [ -z "${BUNDLE_NAME}" ]; then
        echo "No olm.bundle in the rendered template - opm rendered nothing usable." >&2
        exit 1
      fi
      echo "Rendered olm.bundle: ${BUNDLE_NAME}"

      # Sanity: the render must actually point at Block 2's digest.  opm resolves
      # the image it was given, so a mismatch means the template edit did not
      # take - which is the one way this task could still produce a release FBC.
      if ! grep -q "${BUNDLE_IMAGE_DIGEST}" "${SINGLE_BUNDLE_PATH}"; then
        echo "The rendered bundle does not reference ${BUNDLE_IMAGE_DIGEST}." >&2
        echo "The semver template edit did not take effect." >&2
        exit 1
      fi

      # --- DR-F3 step 4: catalog-patch --------------------------------------
      echo "Running fbc-processor.py -op catalog-patch"
      python3 "${UTILS}/utils/fbc-processor/fbc-processor.py" \
        -op catalog-patch \
        -b "${BUILD_CONFIG_PATH}" \
        -c "${OUTPUT_CATALOG_PATH}" \
        -p "${PATCH_YAML_PATH}" \
        -s "${SINGLE_BUNDLE_PATH}" \
        -o "${OUTPUT_CATALOG_PATH}" \
        --purge-bundles "${BUNDLE_NAME}" \
        --push-pipeline-yaml-path "${PUSH_PIPELINE_PATH}" \
        --push-pipeline-operation enable

      if ! grep -q "${BUNDLE_IMAGE_DIGEST}" "${OUTPUT_CATALOG_PATH}"; then
        echo "${CATALOG_REL_PATH} does not reference ${BUNDLE_IMAGE_DIGEST}." >&2
        echo "patch_olm_bundles writes nothing when the rendered bundle name is" >&2
        echo "already in the catalog; --purge-bundles ${BUNDLE_NAME} was supposed" >&2
        echo "to prevent exactly that." >&2
        exit 1
      fi

      echo "FBC processing complete: ${CATALOG_REL_PATH}"
      echo -n "${CATALOG_REL_PATH}" > "${CATALOG_PATH_RESULT}"
      echo -n "${BUNDLE_NAME}"      > "${BUNDLE_NAME_RESULT}"
      echo -n "${BUNDLE_IMAGE}"     > "${FBC_BUNDLE_IMAGE_RESULT}"

  - name: create-trusted-artifact
    image: quay.io/redhat-appstudio/build-trusted-artifacts:latest@sha256:81c4864dae6bb11595f657be887e205262e70086a05ed16ada827fd6391926ac
    args:
    - create
    - --store
    - $(params.ociStorage)
    - $(results.SOURCE_ARTIFACT.path)=/var/workdir/source
    env:
    - name: IMAGE_EXPIRES_AFTER
      value: $(params.ociArtifactExpiresAfter)
