apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: clone-build-config-repo
spec:
  description: |
    Resolves the latest Y-stream release branch on RHOAI-Build-Config and clones
    it into a trusted artifact.

    Upstream ODH uses the stock git-clone-oci-ta task here, because it is handed a
    fixed build-config-revision.  This one cannot be: DR-1a asks for the *latest*
    rhoai-X.Y to be discovered at run time, and git-clone-oci-ta has nowhere to put
    that discovery.  So the resolve and the clone live in one task, and the branch
    it settled on comes back as a result for everything downstream to agree on.

    Nothing here writes to the release branch.  The clone is read-only; every write
    in Block 2 lands on the ephemeral branch that create-ephemeral-branch forks
    from the release-sha this task reports.
  params:
  - name: REPO_URL
    type: string
    default: "https://github.com/red-hat-data-services/RHOAI-Build-Config.git"
    description: RHOAI-Build-Config clone URL
  - name: BRANCH_OVERRIDE
    type: string
    default: ""
    description: |
      Pin the release branch instead of discovering it.  Empty means "resolve the
      latest rhoai-X.Y", which is the normal path.  Set it to reproduce an old run
      or to gate against a branch that is not yet the newest.
  - name: ociStorage
    type: string
    description: OCI storage location for the output trusted artifact
  - name: ociArtifactExpiresAfter
    type: string
    default: "1h"
  results:
  - name: SOURCE_ARTIFACT
    description: Trusted artifact holding the RHOAI-Build-Config working tree
  - name: release-branch
    description: |
      The branch that was resolved and cloned - a discovered rhoai-X.Y, or
      whatever BRANCH_OVERRIDE named.
  - name: release-sha
    description: Head commit of that branch, and the point the ephemeral branch forks from
  - name: rhoai-version
    description: |
      The X.Y portion of release-branch, e.g. 3.6.  Empty when release-branch
      is not a rhoai-X.Y branch, which is the normal case under BRANCH_OVERRIDE.
  - name: component-suffix
    description: |
      The vX-Y form used in RHOAI component and .tekton file names, e.g. v3-6.
      Derived here so no downstream task has to re-parse the branch name.
      Empty under the same condition as rhoai-version.
  volumes:
  - name: workdir
    emptyDir: {}
  stepTemplate:
    volumeMounts:
    - mountPath: /var/workdir
      name: workdir
  steps:
  - name: resolve-and-clone
    image: registry.access.redhat.com/ubi9/ubi-minimal:latest
    env:
    - name: REPO_URL
      value: $(params.REPO_URL)
    - name: BRANCH_OVERRIDE
      value: $(params.BRANCH_OVERRIDE)
    script: |
      #!/bin/bash
      set -euo pipefail

      microdnf install -y git >/dev/null

      if [ -n "${BRANCH_OVERRIDE}" ]; then
        BRANCH="${BRANCH_OVERRIDE}"
        echo "Release branch pinned by BRANCH_OVERRIDE: ${BRANCH}"
      else
        # Same idiom operator-processor.yaml uses to pick a default release
        # branch, and deliberately so - Block 1 and Block 2 must never disagree
        # about which release is current.
        #
        # The rhoai- prefix is stripped before sorting because "rhoai-2" and
        # "rhoai-3" both sort numerically as 0, which would pick rhoai-2.25 over
        # rhoai-3.5.  The [23] major filter matches operator-processor's push
        # filters and skips placeholders like rhoai-99.99.
        #
        # ^[23]\.[0-9]+$ is strict on purpose: it admits rhoai-3.6 and rejects
        # rhoai-3.6-ea.1, rhoai-3.5.1 and rhoai-3.6-ea.1-dry-run-nightly-bundle.
        # Only a plain Y-stream branch is a valid gate target (DR-1a).
        LATEST=$(git ls-remote --heads "${REPO_URL}" 'refs/heads/rhoai-*' \
          | sed 's|.*refs/heads/rhoai-||' \
          | grep -E '^[23]\.[0-9]+$' \
          | sort -t. -k1,1n -k2,2n \
          | tail -1)
        if [ -z "${LATEST}" ]; then
          echo "No rhoai-X.Y branches found on ${REPO_URL}. Cannot determine a release branch." >&2
          exit 1
        fi
        BRANCH="rhoai-${LATEST}"
        echo "Resolved latest Y-stream release branch: ${BRANCH}"
      fi

      git clone --depth 1 --branch "${BRANCH}" "${REPO_URL}" /var/workdir/source
      SHA=$(git -C /var/workdir/source rev-parse HEAD)

      # Only meaningful for a rhoai-X.Y branch.  ${BRANCH#rhoai-} is a no-op on
      # anything else, so with BRANCH_OVERRIDE=gap-poc these used to come out as
      # version "gap-poc" and suffix "vgap-poc", and on a branch with a slash in
      # it the suffix would have carried the slash into what reads like a
      # component name.  Nothing consumes either result today - the pipeline
      # uses release-branch, release-sha and SOURCE_ARTIFACT only - so this was
      # latent rather than broken, and the point of emptying them is that a
      # future consumer gets nothing instead of getting nonsense.
      # The test is the rhoai- prefix, not the stricter ^[23]\.[0-9]+$ the
      # discovery above applies.  Discovery decides which branch is a valid
      # gate target; this only decides whether stripping the prefix produces a
      # version, and it does for every rhoai-* branch - rhoai-3.5-ea.1 gives
      # 3.5-ea.1 and v3-5-ea-1, exactly as before.  Being stricter here would
      # change behaviour for BRANCH_OVERRIDE=rhoai-3.5-ea.1, which is a real
      # way to reproduce an old run and is none of this block's business.
      if [ "${BRANCH}" != "${BRANCH#rhoai-}" ]; then
        VERSION="${BRANCH#rhoai-}"
        SUFFIX="v${VERSION//./-}"
      else
        VERSION=""
        SUFFIX=""
        echo "NOTE: ${BRANCH} is not a rhoai-* branch; rhoai-version and" \
             "component-suffix are left empty rather than echoing the branch name."
      fi

      echo "  branch  ${BRANCH}"
      echo "  sha     ${SHA}"
      echo "  version ${VERSION}"
      echo "  suffix  ${SUFFIX}"

      echo -n "${BRANCH}"  > "$(results.release-branch.path)"
      echo -n "${SHA}"     > "$(results.release-sha.path)"
      echo -n "${VERSION}" > "$(results.rhoai-version.path)"
      echo -n "${SUFFIX}"  > "$(results.component-suffix.path)"

  - name: create-trusted-artifact
    image: quay.io/redhat-appstudio/build-trusted-artifacts:latest@sha256:81c4864dae6bb11595f657be887e205262e70086a05ed16ada827fd6391926ac
    args:
    - create
    - --store
    - $(params.ociStorage)
    - $(results.SOURCE_ARTIFACT.path)=/var/workdir/source
    env:
    - name: IMAGE_EXPIRES_AFTER
      value: $(params.ociArtifactExpiresAfter)
