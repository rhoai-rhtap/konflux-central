apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: create-ephemeral-branch
spec:
  description: |
    Forks an ephemeral branch from a known commit, via the GitHub refs API.

    This is the DR-1 anti-pollution primitive.  RHOAI-Build-Config has no stable
    EG branch, and the existing GitHub workflow (process-operator-bundle.yaml)
    pushes processed bundle content straight to the release branch:

        git push ${FORCE_FLAG} origin HEAD:${PUSH_BRANCH}   # PUSH_BRANCH = rhoai-X.Y

    Replicating that would put temporary EG/PR image digests into rhoai-X.Y.  So
    Block 2 never pushes there.  It forks a throwaway ref, does every write on it,
    and deletes it when the gate is done.

    Deliberately generic - repo, source SHA and branch name are all params, and
    nothing here knows what a bundle is.  Block 3's FBC processing needs the same
    fork on the same repo (DR-7a) and should reuse this task rather than grow a
    second copy of the logic.

    Forking from an explicit SHA rather than a branch name matters: the caller has
    already cloned that commit, so the ephemeral branch and the clone are
    guaranteed to be the same tree even if the release branch moves mid-run.
  params:
  - name: repo
    type: string
    description: org/repo to create the branch in, e.g. red-hat-data-services/RHOAI-Build-Config
  - name: source-sha
    type: string
    description: Commit to fork from, normally the release branch head the caller cloned
  - name: branch-name
    type: string
    description: Name of the ephemeral branch, e.g. eg-bundle-<pipeline-run-id>
  results:
  - name: branch-name
    description: Name of the created ephemeral branch
  - name: branch-sha
    description: Commit the ephemeral branch was forked at
  workspaces:
  - name: github-credentials
    description: Secret workspace holding a 'token' key with a GitHub API token
  steps:
  - name: create-branch
    image: registry.access.redhat.com/ubi9/ubi-minimal:latest
    script: |
      #!/bin/bash
      set -euo pipefail

      REPO="$(params.repo)"
      SOURCE_SHA="$(params.source-sha)"
      BRANCH="$(params.branch-name)"
      TOKEN=$(cat "$(workspaces.github-credentials.path)/token")

      if [ -z "${SOURCE_SHA}" ]; then
        echo "source-sha is empty - refusing to create ${BRANCH} without a known fork point." >&2
        exit 1
      fi

      # Guard against ever being pointed at a release branch.  This task can only
      # create refs, not move them, but the name is the one thing a caller can get
      # wrong in a way that would be silently destructive if the API semantics
      # below ever changed.
      case "${BRANCH}" in
        eg-*) ;;
        *)
          echo "Refusing to create '${BRANCH}': ephemeral branches must be named eg-*." >&2
          exit 1
          ;;
      esac

      echo "Forking ${BRANCH} from ${SOURCE_SHA} in ${REPO}"

      HTTP_CODE=$(curl -sS -o /dev/null -w "%{http_code}" \
        -H "Authorization: token ${TOKEN}" \
        -X POST "https://api.github.com/repos/${REPO}/git/refs" \
        -d "{\"ref\":\"refs/heads/${BRANCH}\",\"sha\":\"${SOURCE_SHA}\"}")

      # 422 is "ref already exists".  A re-run of the same gate should be
      # idempotent, so reset the branch to the fork point rather than failing.
      if [ "${HTTP_CODE}" = "422" ]; then
        echo "Branch ${BRANCH} already exists - resetting it to ${SOURCE_SHA}"
        PATCH_CODE=$(curl -sS -o /dev/null -w "%{http_code}" \
          -H "Authorization: token ${TOKEN}" \
          -X PATCH "https://api.github.com/repos/${REPO}/git/refs/heads/${BRANCH}" \
          -d "{\"sha\":\"${SOURCE_SHA}\",\"force\":true}")
        if [ "${PATCH_CODE}" != "200" ]; then
          echo "Failed to reset ${BRANCH} (HTTP ${PATCH_CODE})" >&2
          exit 1
        fi
      elif [ "${HTTP_CODE}" != "201" ]; then
        echo "Failed to create ${BRANCH} (HTTP ${HTTP_CODE})" >&2
        exit 1
      fi

      echo -n "${BRANCH}"     > "$(results.branch-name.path)"
      echo -n "${SOURCE_SHA}" > "$(results.branch-sha.path)"
