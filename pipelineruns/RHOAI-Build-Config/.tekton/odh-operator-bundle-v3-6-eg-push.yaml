apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  annotations:
    build.appstudio.openshift.io/repo: https://github.com/red-hat-data-services/RHOAI-Build-Config?rev={{revision}}
    build.appstudio.redhat.com/commit_sha: '{{revision}}'
    build.appstudio.redhat.com/target_branch: '{{target_branch}}'
    pipelinesascode.tekton.dev/cancel-in-progress: "false"
    pipelinesascode.tekton.dev/max-keep-runs: "3"
    # No build.appstudio.openshift.io/build-nudge-files here, on purpose.  The
    # release bundle build nudges catalog/catalog-patch.yaml with the digest it
    # just produced; an early-gate build is a throwaway validation of an
    # ephemeral branch and must never open nudge PRs anywhere.  Block 3 gets the
    # digest from the gate pipeline's BUNDLE_IMAGE_REF_BY_DIGEST result instead
    # (DR-7e), which is the same information delivered without touching git.
    #
    # Two pushes land on the ephemeral branch: the fork itself, and the one
    # push-bundle-to-ephemeral-branch makes once the bundle has been processed.
    # Only the second is worth building - the first is just a copy of rhoai-3.6
    # that the release pipelines already cover.
    #
    # Two clauses select it, mirroring rhods-operator-gap-eg-push.yaml, because
    # neither alone covers both shapes the processor's commit can take:
    #
    #   pathChanged  - the ordinary case.  Processing rewrites the CSV and
    #                  bundle_build_args.map, so a change under bundle/ is the
    #                  gate's signature.  Creating a ref reports no changed
    #                  files, so the fork push does not match.
    #   event_title  - the no-op case.  When every gated component already
    #                  matches the release digests there is nothing to write, so
    #                  the commit is made with --allow-empty and touches no path
    #                  at all, leaving the message as the only thing to match on.
    #                  The fork push carries rhoai-3.6's tip message, which never
    #                  starts with "early-gate:": those commits are only ever
    #                  made on ephemeral branches, and ephemeral branches are
    #                  deleted rather than merged.
    #
    # The prefix is written in early-gate/tasks/push-bundle-to-ephemeral-branch.yaml,
    # which validates it.  The two have to change together.
    #
    # Note what is deliberately NOT carried over from the release file: its
    #   files.all.exists(p, !p.matches('^bundle/bundle-patch\\.yaml$'))
    # clause, which suppresses a build when bundle-patch.yaml is the only thing
    # that changed.  On an empty commit files.all is empty and exists() over an
    # empty list is false, so keeping that clause would veto exactly the no-op
    # case the event_title clause exists to catch.
    pipelinesascode.tekton.dev/on-cel-expression: |
      event == "push"
      && target_branch.startsWith("eg-bundle-")
      && ("bundle/**".pathChanged()
          || event_title.startsWith("early-gate:"))
  labels:
    appstudio.openshift.io/application: gap-poc
    appstudio.openshift.io/component: odh-operator-bundle-gap
    pipelines.appstudio.openshift.io/type: build
  name: odh-operator-bundle-v3-6-eg-on-push
  namespace: rhoai-tenant
spec:
  timeouts:
    pipeline: 2h
  params:
  - name: git-url
    value: '{{source_url}}'
  # The ephemeral branch's HEAD - the commit the gate pushed, with the bundle
  # pinned to the gated component digests.  PaC expands this from the push
  # event, so there is no window in which the tag can name a different commit.
  - name: revision
    value: '{{revision}}'
  # eg-bundle-<pipelinerun-uid>-<sha>.  The ephemeral branch is deleted as soon
  # as the gate finishes, so this is the tag that keeps the image reachable
  # after cleanup.  monitor-pac-build reads back the eg-<sha> tag below; both
  # resolve to the same digest.
  - name: additional-tags
    value:
    - '{{target_branch}}-{{revision}}'
  # NOT quay.io/rhoai/odh-operator-bundle.  That is the release repository, and
  # an early-gate bundle assembled from unmerged PRs has no business appearing
  # in it under any tag.  This mirrors Block 1, which pushes to
  # quay.io/redhat-user-workloads/rhoai-tenant/rhods-operator-gap rather than to
  # the release operator repository.
  - name: output-image
    value: quay.io/redhat-user-workloads/rhoai-tenant/odh-operator-bundle-gap:eg-{{revision}}
  # rhoai-init hard-fails a non-pull_request run with an empty rhoai-version.
  # 3.6.0 is what the release bundle pipeline passes; here it only feeds image
  # labels and the CPE id, neither of which the gate acts on.
  - name: rhoai-version
    value: "3.6.0"
  - name: dockerfile
    value: bundle/Dockerfile
  - name: path-context
    value: .
  - name: hermetic
    value: true
  # Explicitly empty, rather than omitted, so that "hermetic build with cachi2
  # prefetch" is visible as a decision rather than a default.  bundle/Dockerfile
  # is FROM scratch and does nothing but COPY manifests and set labels from
  # build args - there is no package manager to feed, so the prefetch task runs
  # and resolves nothing.  The release bundle build does the same.  hermetic
  # still matters: it is what proves the bundle needs no network.
  - name: prefetch-input
    value: ""
  - name: build-source-image
    value: true
  # Single-arch.  A bundle image carries manifests, not binaries; the release
  # bundle build sets this false too, and building an image index for it would
  # exercise a code path the release never takes.
  - name: build-image-index
    value: false
  - name: build-args-file
    value: bundle/bundle_build_args.map
  pipelineRef:
    resolver: git
    params:
    - name: url
      value: https://github.com/rhoai-rhtap/konflux-central.git
    # Pinned to main rather than '{{ target_branch }}', which is how the release
    # file resolves it: target_branch here is the ephemeral eg-bundle-* branch,
    # which exists in RHOAI-Build-Config only and would never resolve against
    # this repository.
    - name: revision
      value: 'main'
    - name: pathInRepo
      value: pipelines/container-build.yaml
  taskRunTemplate:
    serviceAccountName: build-pipeline-odh-operator-bundle-gap
  workspaces:
  - name: git-auth
    secret:
      secretName: '{{ git_auth_secret }}'
status: {}
